      operationId: postDepartments
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentWriteRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /departments/{departmentId}:
    get:
      tags:
        - Catálogos
      summary: Consultar departamento
      description: Detalle del elemento de catálogo.
      operationId: getDepartmentsDepartmentId
      x-roles:
        - AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
