      summary: Consultar categoría
      description: Detalle del elemento de catálogo.
      operationId: getCategoriesCategoryId
      x-roles:
        - AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Catálogos
      summary: Actualizar categoría
      description: Actualización administrativa, sin borrar referencias históricas.
      operationId: patchCategoriesCategoryId
      x-roles:
