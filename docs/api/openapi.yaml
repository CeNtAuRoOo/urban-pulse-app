  /map/incidents:
    get:
      tags:
        - Mapas
      summary: Consultar incidencias y agrupaciones de la provincia de Málaga
      operationId: getMapIncidents
      x-implementation: implemented
      x-roles:
        - AUTHENTICATED
      description: |
        Requiere JWT válido, cuenta activa, rol base CITIZEN y correo verificado. Permisos
        vigentes desde PostgreSQL. OPERATOR/ADMIN global ve todas las incidencias provinciales
        con posición exacta. El resto (incluidos TECHNICIAN y DEPARTMENT_COORDINATOR) ve
        las propias exactas y las ajenas solo si existe incident_reviews.decision=VALIDATE,
        independientemente del estado posterior. Un estado por sí solo no demuestra validación.

        El ámbito es toda la provincia según contorno oficial IGN incorporado al backend,
        incluidas costa y fronteras, sin llamadas externas por petición. La ubicación pública
        ajena usa una cuadrícula métrica fija de unos 100 m; se filtra el viewport y se agrupa
        por esa posición, nunca por la original. No depende del zoom. Reducir precisión no
        garantiza anonimato. Se usan etiquetas genéricas hasta integrar títulos aprobados
        de Tramitación. No se devuelven descripciones ni datos personales y la presencia
        en Mapas no concede acceso al detalle privado de Incidencias.

        Límites WGS84 finitos, inclusivos y estrictamente ordenados; sin cruce de antimeridiano.
        Cada amplitud en grados no puede superar min(360,1440/2^zoom). Zoom 8 permite toda
        la provincia; zoom 18 exige amplitud máxima 0.0054931640625 grados.
        Parámetros desconocidos, repetidos o vacíos se rechazan con 400.

        Celdas fijas de 100*2^(17-zoom) metros para zoom 0..17. En zoom 18..22 todos los elementos
        son individuales, aunque compartan ubicación aproximada. El cluster se dibuja en la
        ubicación autorizada del miembro con UUID lexicográficamente menor, dentro del viewport
        y provincia. Filtros previos al conteo; orden estable por identificador de celda/UUID.

        Máximo 1000 elementos gráficos. Si se supera, 422 MAP_RESULT_LIMIT sin colección parcial:
        reducir el área o el zoom para agrupar más. Timeout SQL de 5 s, 503 MAP_QUERY_TIMEOUT.
        Cuota local de 60 consultas por usuario, reposición 60/minuto; 429 con Retry-After.
        Éxito con Cache-Control no-store. Campos opcionales ausentes omitidos.
      parameters:
        - name: minLat
          in: query
          required: true
          description: Límite sur WGS84, menor que maxLat.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: minLon
          in: query
          required: true
          description: Límite oeste WGS84, menor que maxLon.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: maxLat
          in: query
          required: true
          description: Límite norte WGS84.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: maxLon
          in: query
          required: true
          description: Límite este WGS84.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: zoom
          in: query
          required: true
          description: Nivel entero 0..22; agrupación hasta 17, individuales desde 18.
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: status
          in: query
          description: Estado actual opcional; no sustituye la validación histórica.
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: categoryId
          in: query
          description: Categoría opcional, incluidas inactivas. UUID inexistente devuelve colección vacía.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Colección completa de elementos autorizados dentro del viewport y ámbito provincial.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapIncidentsDTO'
              examples:
                empty:
                  value:
                    items: []
                    count: 0
                    totalIncidents: 0
                publicIncident:
                  summary: Respuesta HTTP capturada en PostgreSQL aislado con datos sintéticos.
                  value:
                    items:
                      - type: INCIDENT
                        incidentId: 42126143-821b-4dce-81ce-636b9752678e
                        title: Incidencia 42126143-821b-4dce-81ce-636b9752678e
                        status: VALIDATED
                        createdAt: '2026-11-10T19:10:40.166261Z'
                        coordinates:
                          latitude: 36.721671408542676
                          longitude: -4.4208714084871055
                        coordinatePrecision: APPROXIMATE
                        canAccessPrivateDetail: false
                    count: 1
                    totalIncidents: 1
                cluster:
                  summary: Agrupación real de dos incidencias autorizadas del mismo conjunto de pruebas.
                  value:
                    items:
                      - type: CLUSTER
                        clusterId: g1:8:0:-1
                        coordinates:
                          latitude: 36.721671408542676
                          longitude: -4.4208714084871055
                        incidentCount: 2
                    count: 1
                    totalIncidents: 2
        '400':
          description: Parámetro ausente, desconocido, repetido, vacío, no finito, mal tipado, fuera de rango, límites invertidos o área excesiva. INVALID_PARAMETER o HTTP_ERROR.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: MAP_RESULT_LIMIT. Más de 1000 elementos; sin colección parcial ni total engañoso.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: RATE_LIMITED. Cuota por usuario de la instancia o capacidad del limitador agotada.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: PostgreSQL no disponible o MAP_QUERY_TIMEOUT; sin respuesta parcial.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
