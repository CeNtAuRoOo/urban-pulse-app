        - Conocimiento
      summary: Listar documentos
      description: Catálogo de documentos indexados y versiones.
      operationId: getKnowledgeDocuments
      x-roles:
        - OPERATOR
        - ANALYST
        - ADMIN
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeDocumentDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /knowledge/queries:
    post:
      tags:
        - Conocimiento
      summary: Consultar procedimientos con RAG
      description: Responde con citas documentales verificables; marca insuficiencia de evidencia y no suplanta decisiones humanas.
      operationId: postKnowledgeQueries
      x-roles:
        - OPERATOR
        - TECHNICIAN
        - ANALYST
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
