openapi: 3.0.3
info:
  title: UrbanPulse API REST
  version: 0.3.0
  description: Contrato del tag Autenticación implementado en el backend (registro, login y cambio de contraseña). Dominio v1 y ADR de identidad actualizados. Las restantes áreas del API mantienen su carácter de propuesta revisable por tag. Funciones avanzadas opcionales aplazadas.
  contact:
    name: Equipo UrbanPulse
servers:
  - url: http://localhost:8888/api/v1
    description: Backend local en desarrollo (prefijo /api/v1 previsto).
security:
  - BearerAuth: []
tags:
  - name: Autenticación
    description: Registro, login y cambio de contraseña mediante credenciales/JWT.
  - name: Usuarios
    description: Perfil y gestión administrativa de usuarios.
  - name: Invitaciones
    description: Canje y emisión controlados según ADR-0007 (aceptado).
  - name: Catálogos
    description: Categorías y departamentos.
  - name: Incidencias
    description: Registro, consulta, edición y seguimiento.
  - name: Evidencias
    description: Fotografías privadas asociadas a incidencias.
  - name: Tramitación
    description: Validación, derivación departamental, asignación de trabajos, cambios de estado y colaboración.
  - name: Duplicados
    description: Detección y confirmación de avisos relacionados.
  - name: Contexto urbano
    description: Datos geográficos, activos y observaciones externas.
  - name: Mapas
    description: Representación cartográfica de incidencias.
  - name: Notificaciones
    description: Bandeja y preferencias de avisos.
  - name: Analítica
    description: Métricas y análisis territorial.
  - name: Informes
    description: Generación y descarga de informes.
  - name: Administración
    description: Fuentes externas, auditoría y administración técnica.
paths:
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar ciudadano e iniciar sesión
      description: Crea una cuenta activa con rol global CITIZEN y emite un JWT de acceso de 7200 segundos. No admite seleccionar roles ni establecer emailVerified. El cuerpo está limitado a 16 KiB y el registro está limitado por IP. Durante esta primera fase el correo permanece sin verificar; el envío y la obligatoriedad de confirmación se implementarán posteriormente. El token emitido queda sujeto a comprobación de estado de cuenta, rol CITIZEN y tokenVersion en cada acceso protegido.
      operationId: postAuthRegister
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta ciudadana creada y sesión iniciada. No implica correo verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
          headers:
            Location:
              description: Ubicación contextual prevista /api/v1/users/me. Solo anunciarla cuando el recurso de consulta esté disponible; el GET corresponde al tag Usuarios.
              schema:
                type: string
                example: /api/v1/users/me
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Valida credenciales BCrypt y cuenta activa y emite un JWT Bearer de 7200 segundos. El cuerpo se limita a 16 KiB y existe rate limiting por IP y email normalizado. Devuelve un 401 genérico tanto para usuario inexistente como para contraseña incorrecta o cuenta desactivada. No hay refresh tokens en esta versión. Fallos temporales de PostgreSQL devuelven 503 en lugar de 401.
      operationId: postAuthLogin
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas; JWT emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me/password-changes:
    post:
      tags:
        - Autenticación
      summary: Cambiar mi contraseña
      description: Requiere JWT Bearer vigente y la contraseña actual. Actualiza el hash BCrypt e incrementa User.tokenVersion de forma atómica. Todos los JWT emitidos previamente, incluido el usado en esta operación, quedan inválidos para las siguientes peticiones; el cliente debe autenticarse otra vez. El cuerpo está limitado a 16 KiB, pero esta operación no consume tokens del rate limiter. No envía correos.
      operationId: postUsersMePasswordChanges
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada; tokens anteriores invalidados. Sin cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me:
    get:
      tags:
        - Usuarios
      summary: Consultar mi perfil
      description: Devuelve los datos personales del usuario autenticado.
      operationId: getUsersMe
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Usuarios
      summary: Modificar mi perfil
      description: Actualiza únicamente atributos permitidos del perfil; no modifica roles.
      operationId: patchUsersMe
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: Listado restringido al administrador; filtros y paginación.
      operationId: getUsers
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoleCode'
          description: Filtrar por rol.
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filtrar por actividad.
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    get:
      tags:
        - Usuarios
      summary: Consultar usuario
      description: Información del usuario para administración; no pública.
      operationId: getUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Usuarios
      summary: Administrar usuario
      description: Permite activar/desactivar la cuenta. Los roles se conceden mediante invitaciones; las adscripciones departamentales tienen reglas propias.
      operationId: patchUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff-invitations:
    post:
      tags:
        - Invitaciones
      summary: Crear invitación municipal
      description: 'ADR-0007 aceptado: invitación de un solo uso; rol GLOBAL o rol DEPARTMENT con departamento. Código revelado solo al crearla.'
      operationId: postStaffInvitations
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreatedDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Invitaciones
      summary: Listar invitaciones
      description: Devuelve metadatos, nunca el código original en claro.
      operationId: getStaffInvitations
      x-roles:
        - ADMIN
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff-registrations:
    post:
      tags:
        - Invitaciones
      summary: Canjear invitación
      description: Canje de invitación al registrar una cuenta nueva. Si el correo corresponde a una cuenta existente, utilizar el canje autenticado sin crear usuario duplicado.
      operationId: postAuthStaffRegistrations
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegistrationRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me/staff-invitation-redemptions:
    post:
      tags:
        - Invitaciones
      summary: Canjear invitación con cuenta existente
      description: Añade el rol global o pertenencia departamental autorizados a la cuenta autenticada. Canje atómico y auditable; no cambia identidad/correo.
      operationId: postUsersMeStaffInvitationRedemptions
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExistingAccountInvitationRedemptionRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff-invitations/{invitationId}/revocations:
    post:
      tags:
        - Invitaciones
      summary: Revocar invitación
      description: Invalida una invitación activa. Operación administrativa auditada.
      operationId: postStaffInvitationsInvitationIdRevocations
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Operación correcta, sin cuerpo de respuesta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
