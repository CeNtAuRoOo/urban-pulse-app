      operationId: getExternalSources
      x-roles:
        - ADMIN
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalSourceDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Administración
      summary: Registrar fuente de datos
      description: Registra metadatos públicos de la fuente; las claves de integración van fuera del contrato y del repositorio.
      operationId: postExternalSources
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSourceRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSourceDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /external-sources/{sourceId}:
    patch:
      tags:
        - Administración
      summary: Configurar fuente
      description: Activa/desactiva y ajusta configuración permitida de una fuente.
      operationId: patchExternalSourcesSourceId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSourcePatchRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSourceDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /audit-events:
    get:
      tags:
        - Administración
      summary: Consultar auditoría
      description: Acciones administrativas y cambios relevantes, con correlación por requestId.
      operationId: getAuditEvents
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Actor.
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
          description: Tipo de recurso.
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
          description: Recurso.
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT del backend, según ADR-0005. Roles y permisos se verifican en servidor.
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Identificador URI del tipo de problema.
          example: about:blank
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP asociado.
        code:
          type: string
          description: Código estable para tratamiento programático.
          example: INVALID_TRANSITION
        detail:
          type: string
          description: Explicación sin datos sensibles.
        instance:
          type: string
          description: Ruta de la petición que originó el error.
        requestId:
          type: string
          description: Identificador correlacionable con los registros del servidor.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Errores de campos, cuando corresponda.
      required:
        - title
        - status
        - code
        - detail
      description: Formato de error uniforme inspirado en Problem Details (RFC 9457).
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: Nombre del campo.
        code:
          type: string
          description: Código de validación.
        message:
          type: string
          description: Motivo legible.
      required:
        - field
        - code
        - message
    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 20
        totalItems:
          type: integer
          description: Número total de resultados.
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
    CoordinatesDTO:
      type: object
      properties:
        latitude:
          type: number
          description: Latitud WGS84, grados.
          minimum: -90
          maximum: 90
          example: 36.7213
        longitude:
          type: number
          description: Longitud WGS84, grados.
          minimum: -180
          maximum: 180
          example: -4.4214
        accuracyMeters:
          type: number
          description: Precisión estimada de la posición en metros.
          minimum: 0
          example: 8
      required:
        - latitude
        - longitude
      description: Coordenadas geográficas; la precisión es opcional.
    LocationDTO:
      type: object
      properties:
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        formattedAddress:
          type: string
          description: Dirección normalizada (puede estar ausente si falla la geocodificación).
        neighborhood:
          type: string
          description: Barrio deducido de la posición.
        districtId:
          type: string
          description: Distrito obtenido por geocodificación.
          format: uuid
        districtName:
          type: string
          description: Nombre del distrito.
        geocodingStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - UNAVAILABLE
          description: Resultado del enriquecimiento de localización.
      required:
        - coordinates
        - geocodingStatus
    IncidentStatus:
      type: string
      enum:
        - REPORTED
        - VALIDATED
        - REJECTED
        - ASSIGNED_TO_DEPARTMENT
        - WORK_ASSIGNED
        - IN_PROGRESS
        - RESOLVED
        - REOPENED
        - CLOSED
      description: 'ADR-0010: validación y derivación pueden estar separadas; el trabajo se distribuye después. La matriz completa de transiciones permanece pendiente.'
    IncidentPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      description: Escala acordada para UrbanPulse; LOW, MEDIUM, HIGH, CRITICAL.
    CreateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          description: Título breve.
          minLength: 5
          maxLength: 150
        description:
          type: string
          description: Descripción detallada.
          minLength: 10
          maxLength: 5000
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        categoryId:
          type: string
          format: uuid
          description: Categoría opcional; puede decidirse durante revisión.
      required:
        - title
        - description
        - coordinates
      additionalProperties: false
    UpdateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 10
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
          description: Categoría opcional; puede decidirse durante revisión.
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
      description: 'Edición limitada por estado y propiedad; propuesta: titular mientras REPORTED o personal autorizado.'
      additionalProperties: false
    IncidentSummaryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        location:
          $ref: '#/components/schemas/LocationDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attachmentCount:
          type: integer
          minimum: 0
      required:
        - id
        - title
        - status
        - location
        - createdAt
        - updatedAt
        - attachmentCount
    IncidentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        reporter:
          $ref: '#/components/schemas/UserSummaryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        prioritySource:
          type: string
          enum:
            - MANUAL
            - ASSISTED
          description: Ausente hasta priorización.
        priorityJustification:
          type: string
        location:
          $ref: '#/components/schemas/LocationDTO'
        urbanAsset:
          $ref: '#/components/schemas/UrbanAssetAssociationDTO'
        currentAssignment:
          $ref: '#/components/schemas/AssignmentDTO'
        contextStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - PARTIAL
            - UNAVAILABLE
        attachmentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Versión de control de concurrencia; propuesta.
          minimum: 0
        assignedDepartment:
          $ref: '#/components/schemas/DepartmentDTO'
      required:
        - id
        - title
        - description
        - status
        - location
        - contextStatus
        - attachmentCount
        - createdAt
        - updatedAt
      description: El departamento actual se devuelve en assignedDepartment; currentAssignment representa solamente trabajo activo (ADR-0010).
    IncidentPageDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummaryDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - data
        - pagination
    HistoryEventDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - CREATED
            - REVIEWED
            - PRIORITIZED
            - DEPARTMENT_ASSIGNED
            - DEPARTMENT_TRANSFERRED
            - WORK_ASSIGNED
            - WORK_REASSIGNED
            - STATUS_CHANGED
            - COMMENTED
            - ATTACHMENT_ADDED
            - ASSET_LINKED
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserSummaryDTO'
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Datos públicos o internos según permisos; sin información sensible.
      required:
        - id
        - eventType
        - occurredAt
        - summary
    UserSummaryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Ana Pérez
      required:
        - id
        - displayName
      description: Vista mínima de usuario. No revela roles ni pertenencias departamentales en respuestas de incidencias.
    UserDTO:
      type: object
      description: Vista autorizada del usuario. En registro y login se devuelve el perfil del propio titular; jamás incluye passwordHash ni tokenVersion. email y departmentMemberships se exponen solo cuando el solicitante tenga permiso. No constituye un mecanismo de fields dinámico.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
          description: Visible únicamente para el titular o personal autorizado.
        emailVerified:
          type: boolean
          description: Indica si se ha verificado el control del correo. Se inicializa a false en registro; la verificación obligatoria mediante email es una funcionalidad futura.
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          description: Roles GLOBAL concedidos mediante UserRole. Toda cuenta tiene CITIZEN; los roles DEPARTMENT se consultan a través de departmentMemberships.
          items:
            $ref: '#/components/schemas/GlobalRoleCode'
          uniqueItems: true
        departmentMemberships:
          type: array
          description: Adscripciones departamentales, visibles según autorización.
          items:
            $ref: '#/components/schemas/DepartmentMembershipDTO'
      required:
        - id
        - displayName
        - emailVerified
        - active
        - createdAt
        - roles
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
      description: Solo admite el nombre público; no permite modificar roles.
      additionalProperties: false
    AdminUpdateUserRequest:
      type: object
      properties:
        active:
          type: boolean
      description: Permite activar/desactivar cuentas; la concesión de roles privilegiados utiliza invitaciones (ADR-0007). Revocación y gestión de pertenencias requieren contrato propio.
      additionalProperties: false
      minProperties: 1
    UsersPageDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - data
        - pagination
    RoleCode:
      type: string
      enum:
        - CITIZEN
        - OPERATOR
        - ADMIN
        - DEPARTMENT_COORDINATOR
        - TECHNICIAN
      description: Catálogo completo de códigos; el ámbito se deduce del código (sin RoleScope persistido). Para DTO por ámbito se emplean GlobalRoleCode y DepartmentRoleCode.
    DepartmentMembershipDTO:
      type: object
      description: Adscripción a departamento con rol DEPARTMENT; solo se facilita a personas autorizadas. Las fechas conservan historial.
      properties:
        department:
          $ref: '#/components/schemas/DepartmentDTO'
        role:
          $ref: '#/components/schemas/DepartmentRoleCode'
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
      required:
        - department
        - role
        - joinedAt
    GlobalRoleCode:
      type: string
      enum:
        - CITIZEN
        - OPERATOR
        - ADMIN
      description: Roles globales definidos en ADR-0009. CITIZEN es inherente a toda cuenta; OPERATOR y ADMIN son privilegios adicionales.
    DepartmentRoleCode:
      type: string
      enum:
        - DEPARTMENT_COORDINATOR
        - TECHNICIAN
      description: Roles departamentales; requieren DepartmentMembership activa para actuar.
    RegisterRequest:
      type: object
      description: Alta ciudadana pública; el rol CITIZEN y emailVerified=false los asigna el servidor.
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
          description: Se normaliza mediante trim/minúsculas y se compara sin distinción de mayúsculas según la política de unicidad.
        password:
          type: string
          format: password
          description: Contraseña enviada solo mediante TLS; mínimo 8 caracteres y máximo 72 bytes UTF-8 por BCrypt; jamás se devuelve ni registra.
          minLength: 8
      required:
        - displayName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
      required:
        - email
        - password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      description: La contraseña actual debe coincidir con la almacenada; al cambiarla se invalidan todas las sesiones JWT previas mediante tokenVersion.
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Máximo 72 bytes UTF-8 por BCrypt; se valida en backend.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    TokenDTO:
      type: object
      description: Respuesta de registro ciudadano o login; accessToken es un JWT firmado y no cifrado.
      properties:
        accessToken:
          type: string
          description: JWT Bearer con claims sub (UUID de usuario), iat, exp, iss y ver (tokenVersion). Los roles no son fuente de autorización dentro del token.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Duración del token de acceso en segundos; versión inicial 7200.
          minimum: 1
          example: 7200
        user:
          $ref: '#/components/schemas/UserDTO'
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
    InvitationRequest:
      oneOf:
        - $ref: '#/components/schemas/GlobalInvitationRequest'
        - $ref: '#/components/schemas/DepartmentInvitationRequest'
      description: 'ADR-0007/0009: el ámbito determina si se exige departmentId. Los roles globales invitables son OPERATOR y ADMIN, nunca CITIZEN; CITIZEN es inherente a toda cuenta.'
    InvitationDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleCode'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - ACTIVE
            - REDEEMED
            - REVOKED
            - EXPIRED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
        departmentId:
          type: string
          format: uuid
          description: Departamento destinatario; obligatorio para roles DEPARTMENT y ausente para roles GLOBAL.
      required:
        - id
        - role
        - status
        - createdAt
        - expiresAt
      description: Metadatos de invitación; el código se revela solo en InvitationCreatedDTO.
    InvitationCreatedDTO:
      allOf:
        - $ref: '#/components/schemas/InvitationDTO'
        - type: object
          properties:
            invitationCode:
              type: string
              description: Solo se revela al crear una invitación; nunca se almacena en claro.
          required:
            - invitationCode
      description: Código entregado una sola vez.
    StaffRegistrationRequest:
      type: object
      properties:
        invitationCode:
          type: string
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
      required:
        - invitationCode
        - displayName
        - email
        - password
      additionalProperties: false
      description: Alta de cuenta nueva con invitación; asignar CITIZEN además de los privilegios invitados. Si el email ya pertenece a una cuenta, utilizar canje autenticado sin crear otro User. Política de verificación de correo pendiente.
    ExistingAccountInvitationRedemptionRequest:
      type: object
      properties:
        invitationCode:
          type: string
      required:
        - invitationCode
      additionalProperties: false
    StaffGlobalRoleCode:
      type: string
      enum:
        - OPERATOR
        - ADMIN
      description: Roles globales privilegiados que pueden otorgarse mediante invitación.
    GlobalInvitationRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/StaffGlobalRoleCode'
        email:
          type: string
          format: email
          description: Correo autorizado opcional; política definitiva pendiente.
        expiresAt:
          type: string
          format: date-time
      required:
        - role
      additionalProperties: false
      description: Invitación para rol global de personal (OPERATOR o ADMIN); no admite departmentId ni CITIZEN.
    DepartmentInvitationRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/DepartmentRoleCode'
        departmentId:
          type: string
          format: uuid
          description: Departamento de adscripción al canjear la invitación.
        email:
          type: string
          format: email
          description: Correo autorizado opcional; política definitiva pendiente.
        expiresAt:
          type: string
          format: date-time
      required:
        - role
        - departmentId
      additionalProperties: false
      description: Invitación para rol departamental; requiere departmentId. La cuenta conserva también CITIZEN.
    CategoryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tráfico y semáforos
        description:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - active
    CategoryWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      required:
        - name
      additionalProperties: false
    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos de la categoría.
      additionalProperties: false
      minProperties: 1
    DepartmentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Movilidad
        description:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - active
    DepartmentWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      required:
        - name
      additionalProperties: false
    DepartmentPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos del departamento.
      additionalProperties: false
      minProperties: 1
    ReviewRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
        reason:
          type: string
          description: Obligatorio en rechazo o solicitud de información.
          minLength: 3
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
      required:
        - decision
      additionalProperties: false
    ReviewDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
