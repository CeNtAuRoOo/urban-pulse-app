            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Error inesperado del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: Servicio temporalmente no disponible (no se aplica a un enriquecimiento contextual opcional).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
