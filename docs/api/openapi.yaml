openapi: 3.0.3
info:
  title: UrbanPulse API REST
  version: 0.7.0
  description: Contrato de los tags Autenticación, Usuarios e Invitaciones implementados en el backend (registro, login, cambio de contraseña, verificación de correo, perfil, administración de usuarios y concesión de permisos por invitación). Departamentos y Categorías también implementan consulta, alta y PATCH. Incidencias implementa seis operaciones de alta, listados, detalle, corrección con If-Match e historial paginado. Mapas implementa consulta provincial con privacidad y agrupaciones. Las restantes áreas del API mantienen su carácter de propuesta revisable; al implementarlas, toda petición protegida requerirá también EMAIL_VERIFIED salvo excepciones explícitas de autenticación por tag. Funciones avanzadas opcionales aplazadas.
  contact:
    name: Equipo UrbanPulse
servers:
  - url: http://localhost:8888/api/v1
    description: Backend local en desarrollo (prefijo /api/v1 implementado).
security:
  - BearerAuth: []
tags:
  - name: Autenticación
    description: Registro, login, cambio de contraseña y verificación obligatoria de correo mediante código.
  - name: Usuarios
    description: Perfil y gestión administrativa de usuarios.
  - name: Invitaciones
    description: Canje y emisión controlados según ADR-0007 (aceptado).
  - name: Catálogos
    description: Categorías y departamentos.
  - name: Incidencias
    description: Registro, consulta, edición y seguimiento.
  - name: Evidencias
    description: Fotografías privadas asociadas a incidencias.
  - name: Tramitación
    description: Validación, derivación departamental, asignación de trabajos, cambios de estado y colaboración.
  - name: Duplicados
    description: Detección y confirmación de avisos relacionados.
  - name: Contexto urbano
    description: Datos geográficos, activos y observaciones externas.
  - name: Mapas
    description: Consulta provincial de Málaga con permisos vigentes, privacidad y agrupaciones por zoom.
  - name: Notificaciones
    description: Bandeja y preferencias de avisos.
  - name: Analítica
    description: Métricas y análisis territorial.
  - name: Informes
    description: Generación y descarga de informes.
  - name: Administración
    description: Fuentes externas, auditoría y administración técnica.
paths:
  /auth/register:
    post:
      x-implementation: implemented
      tags:
        - Autenticación
      summary: Registrar ciudadano y solicitar verificación de correo
      description: Crea una cuenta activa con rol global CITIZEN y emite un JWT de acceso de 7200 segundos. No admite seleccionar roles ni establecer emailVerified. Crea transaccionalmente el usuario, CITIZEN y el HMAC del código; solicita el envío SMTP después del commit, sin revertir el registro si falla el correo. El cuerpo está limitado a 16 KiB y el registro se limita por IP. Devuelve JWT incluso con emailVerified=false, pero se restringe el acceso a las operaciones de autenticación permitidas hasta confirmar el correo. El token sigue sujeto a actividad, CITIZEN y tokenVersion.
      operationId: postAuthRegister
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta ciudadana creada, código preparado y JWT emitido con acceso limitado; la entrega SMTP no está garantizada. emailVerified=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    post:
      x-implementation: implemented
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Valida credenciales BCrypt y cuenta activa y emite un JWT Bearer de 7200 segundos. El cuerpo se limita a 16 KiB y existe rate limiting por IP y email normalizado. Devuelve un 401 genérico tanto para usuario inexistente como para contraseña incorrecta o cuenta desactivada. Se permite login de cuentas sin verificar, pero su JWT tiene acceso limitado. No hay refresh tokens. Fallos temporales de PostgreSQL devuelven 503 en lugar de 401.
      operationId: postAuthLogin
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas; JWT emitido. Si emailVerified=false, solo acceso de autenticación limitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/email-verifications/confirm:
    post:
      x-implementation: implemented
      tags:
        - Autenticación
      summary: Confirmar el correo de la cuenta autenticada
      operationId: postEmailVerificationConfirm
      x-roles:
        - AUTHENTICATED
      description: Requiere JWT válido, aunque el correo todavía no esté verificado. Recibe un código numérico ASCII de 8 dígitos, comprueba su HMAC ligado al usuario, la caducidad (10 minutos o final del plazo de 24 horas de la cuenta) y lo consume en la misma transacción que marca emailVerified=true. Si ya estaba verificado devuelve 204 (operación idempotente). El mismo JWT habilita el acceso a rutas de negocio en la siguiente petición, pues la autorización relee PostgreSQL. Límite de cuerpo de 16 KiB; buckets en memoria por usuario (5/3600 s) e IP (30/3600 s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204':
          description: Correo verificado o ya verificado. Sin cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Código ausente, incorrecto, sustituido o caducado (INVALID_VERIFICATION_CODE), o error de validación del formato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/email-verifications/resend:
    post:
      x-implementation: implemented
      tags:
        - Autenticación
      summary: Solicitar otro código de verificación
      operationId: postEmailVerificationResend
      x-roles:
        - AUTHENTICATED
      description: 'Requiere JWT válido y cuerpo vacío. Sustituye el código anterior y solicita el envío SMTP después del commit. 202 no asegura entrega final del correo. Devuelve 204 si la cuenta ya está verificada y 410 si pasaron 24 horas desde el registro (aunque todavía no se haya eliminado en la limpieza). Límite de cuerpo 16 KiB; cuotas en memoria: 1/60 s de enfriamiento por cuenta, 5/86400 s por cuenta como bucket continuo (NO cinco exactos por día) y 20/3600 s por IP. Los buckets se consumen en orden y no se reembolsan cuando una política posterior rechaza.'
      responses:
        '202':
          description: Nuevo código persistido y envío solicitado después del commit. Sin cuerpo.
        '204':
          description: Cuenta ya verificada, no se genera otro código. Sin cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me/password-changes:
    post:
      x-implementation: implemented
      tags:
        - Autenticación
      summary: Cambiar mi contraseña
      description: Requiere JWT Bearer vigente y la contraseña actual. Actualiza el hash BCrypt e incrementa User.tokenVersion de forma atómica. Todos los JWT emitidos previamente, incluido el usado en esta operación, quedan inválidos para las siguientes peticiones; el cliente debe autenticarse otra vez. Se permite también a cuentas sin verificar. El cuerpo está limitado a 16 KiB, pero esta operación no consume tokens del rate limiter. No envía correos.
      operationId: postUsersMePasswordChanges
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada; tokens anteriores invalidados. Sin cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me:
    get:
      x-implementation: implemented
      tags:
        - Usuarios
      summary: Consultar mi perfil
      description: Devuelve el perfil del titular, sus roles globales y todas sus pertenencias departamentales activas e históricas. Requiere cuenta activa y correo verificado.
      x-email-verified: true
      operationId: getUsersMe
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      x-implementation: implemented
      tags:
        - Usuarios
      summary: Modificar mi perfil
      description: Actualiza únicamente el nombre público del titular. La respuesta incluye sus roles globales y pertenencias departamentales activas e históricas. Requiere cuenta activa y correo verificado.
      x-email-verified: true
      operationId: patchUsersMe
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users:
    get:
      x-implementation: implemented
      tags:
        - Usuarios
      summary: Listar usuarios
      description: Listado restringido al administrador. Incluye roles globales y pertenencias departamentales activas e históricas; el filtro por rol departamental solo considera pertenencias activas. Orden createdAt descendente e id ascendente. Primera página 1; tamaño 20 por defecto (1–100); offset máximo 2147483647.
      x-email-verified: true
      operationId: getUsers
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoleCode'
          description: Filtrar por rol global asignado o pertenencia departamental activa.
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filtrar por actividad.
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/{userId}:
    get:
      x-implementation: implemented
      tags:
        - Usuarios
      summary: Consultar usuario
      description: Información del usuario para administración; incluye roles globales y pertenencias departamentales activas e históricas. Requiere cuenta activa y correo verificado.
      x-email-verified: true
      operationId: getUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      x-implementation: implemented
      tags:
        - Usuarios
      summary: Administrar usuario
      description: Permite activar/desactivar la cuenta. Los roles se conceden mediante invitaciones; las adscripciones departamentales tienen reglas propias.
      x-email-verified: true
      operationId: patchUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: LAST_ACTIVE_ADMIN; la baja dejaría sin ADMIN activo y verificado. La autodesactivación se permite si queda otro.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /staff-invitations:
    post:
      x-implementation: implemented
      tags:
        - Invitaciones
      summary: Emitir invitación municipal
      description: ADMIN activo y EMAIL_VERIFIED. Crea solo una invitación y auditoría; no crea User. Vigencia de 7 días exactos por defecto. Permite duplicados. Código solo por EmailSender después del commit. 201 no garantiza entrega SMTP; ante fallo, revocar y emitir otra. Cuerpo máximo 16 KiB.
      operationId: postStaffInvitations
      security:
        - BearerAuth: []
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Invitación creada sin secreto; entrega SMTP solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDTO'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Location:
              description: Ruta consultable del recurso creado.
              schema:
                type: string
                example: /api/v1/staff-invitations/019a0000-0000-7000-8000-000000000001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      x-implementation: implemented
      tags:
        - Invitaciones
      summary: Listar invitaciones
      description: ADMIN activo y EMAIL_VERIFIED. Filtros exactos aplicados en SQL antes de paginar. Orden createdAt DESC, id DESC. Página inicial 1; 20 elementos por defecto y máximo 100. Página fuera de rango devuelve data vacío con totales reales. Offset máximo 2147483647; sobrepasarlo devuelve 422. Inserciones concurrentes pueden desplazar páginas.
      operationId: getStaffInvitations
      security:
        - BearerAuth: []
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - name: email
          in: query
          description: Coincidencia exacta tras trim y minúsculas; no admite vacío.
          schema:
            type: string
            format: email
            maxLength: 254
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/RoleCode'
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página administrativa, sin códigos ni hashes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPageDTO'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /staff-invitations/{invitationId}:
    get:
      x-implementation: implemented
      tags:
        - Invitaciones
      summary: Consultar invitación
      description: Solo ADMIN activo con EMAIL_VERIFIED. Nunca revela el código ni su HMAC.
      operationId: getStaffInvitation
      security:
        - BearerAuth: []
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Metadatos administrativos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDTO'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me/staff-invitation-redemptions:
    post:
      x-implementation: implemented
      tags:
        - Invitaciones
      summary: Canjear invitación con cuenta verificada
      description: Requiere JWT de cuenta activa con CITIZEN y EMAIL_VERIFIED. Su email debe coincidir exactamente con el invitado. Concede solo el permiso almacenado, conserva ciudadanía e identidad y audita atómicamente. El JWT existente reconoce roles globales en la siguiente petición. Un permiso activo previo devuelve 409 PERMISSION_ALREADY_GRANTED sin consumir. Código inexistente, usado, revocado, caducado o de otro correo devuelve 422 INVALID_INVITATION_CODE indistinguible. Departamento inactivo o inexistente devuelve 422 INVALID_DEPARTMENT. Cuerpo máximo 16 KiB. Token buckets por usuario 10/900 s e IP 30/900 s, reposición gradual local por instancia.
      operationId: postStaffInvitationRedemption
      security:
        - BearerAuth: []
      x-roles:
        - CITIZEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRedemptionRequest'
      responses:
        '200':
          description: Permiso concedido; no se crea usuario ni se emite otro JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationRedemptionDTO'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /staff-invitations/{invitationId}/revocations:
    post:
      x-implementation: implemented
      tags:
        - Invitaciones
      summary: Revocar invitación activa
      description: Solo ADMIN activo y verificado; cuerpo vacío. Guarda revokedBy, revokedAt y auditoría en una transacción. Estados finales devuelven 409 INVITATION_NOT_ACTIVE; no retira permisos concedidos.
      operationId: postStaffInvitationRevocation
      security:
        - BearerAuth: []
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Revocación confirmada; sin cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /categories:
    get:
      x-implementation: implemented
      tags:
        - Catálogos
      summary: Listar categorías
      description: Incluye categorías activas e inactivas, ordenadas por nombre ascendente según collation PostgreSQL y UUID como desempate. Requiere correo verificado.
      operationId: getCategories
      x-roles:
        - AUTHENTICATED
      x-email-verified: true
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      x-implementation: implemented
      tags:
        - Catálogos
      summary: Crear categoría
