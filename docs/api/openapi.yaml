    patch:
      tags:
        - Catálogos
      summary: Actualizar departamento
      description: Actualización administrativa, sin borrar referencias históricas.
      operationId: patchDepartmentsDepartmentId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentPatchRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /incidents:
    post:
      tags:
        - Incidencias
      summary: Registrar incidencia
      description: Registra inmediatamente en REPORTED y genera la primera entrada de auditoría. Geocodificación, duplicados, activos y contexto urbano son enriquecimientos opcionales que no bloquean la creación. Las fotografías se adjuntan después.
      operationId: postIncidents
      x-roles:
        - CITIZEN
        - OPERATOR
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDTO'
          headers:
