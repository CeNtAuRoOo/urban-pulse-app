openapi: 3.0.3
info:
  title: UrbanPulse API REST
  version: 0.1.0
  description: Contrato inicial design-first para la plataforma cloud de gestión de incidencias urbanas UrbanPulse. Cubre el núcleo de incidencias y los casos de uso complementarios previstos en el enunciado. Las rutas y la estructura de DTOs son propuestas de diseño; las políticas de autorización, transiciones de estado, límites de ficheros, procesamiento asíncrono y otros detalles deben ratificarse antes de implementar. No representa una API ya desplegada.
  contact:
    name: Equipo UrbanPulse
servers:
  - url: http://localhost:8888/api/v1
    description: Backend local en desarrollo (ruta /api/v1 propuesta, aún no implementada).
security:
  - BearerAuth: []
tags:
  - name: Autenticación
    description: Registro y acceso mediante credenciales/JWT.
  - name: Usuarios
    description: Perfil y gestión administrativa de usuarios.
  - name: Invitaciones
    description: Propuesta de incorporación controlada de personal municipal.
  - name: Catálogos
    description: Categorías y departamentos.
  - name: Incidencias
    description: Registro, consulta, edición y seguimiento.
  - name: Evidencias
    description: Fotografías privadas asociadas a incidencias.
  - name: Tramitación
    description: Revisión, prioridad, asignaciones, estados y colaboración.
  - name: Duplicados
    description: Detección y confirmación de avisos relacionados.
  - name: Contexto urbano
    description: Datos geográficos, activos y observaciones externas.
  - name: Mapas
    description: Representación cartográfica de incidencias.
  - name: Notificaciones
    description: Bandeja y preferencias de avisos.
  - name: Analítica
    description: Métricas y análisis territorial.
  - name: Informes
    description: Generación y descarga de informes.
  - name: Asistencia inteligente
    description: Evaluación asistida y experimentos de modelos.
  - name: Conocimiento
    description: Documentos y consultas RAG con citas.
  - name: Administración
    description: Fuentes externas, auditoría y administración técnica.
paths:
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar ciudadano
      description: Crea una cuenta con rol CITIZEN. La petición no admite seleccionar roles privilegiados.
      operationId: postAuthRegister
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: Valida credenciales y emite un JWT Bearer. Duración, renovación y revocación aún por definir.
      operationId: postAuthLogin
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags:
        - Usuarios
      summary: Consultar mi perfil
      description: Devuelve los datos personales del usuario autenticado.
      operationId: getUsersMe
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Usuarios
      summary: Modificar mi perfil
      description: Actualiza únicamente atributos permitidos del perfil; no modifica roles.
      operationId: patchUsersMe
      x-roles:
        - AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: Listado restringido al administrador; filtros y paginación.
      operationId: getUsers
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
          description: Filtrar por rol.
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filtrar por actividad.
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    get:
      tags:
        - Usuarios
      summary: Consultar usuario
      description: Información del usuario para administración; no pública.
      operationId: getUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Usuarios
      summary: Administrar usuario
      description: Cambia estado o rol de una cuenta de forma auditada; no expone operaciones de autoelevación.
      operationId: patchUsersUserId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff-invitations:
    post:
      tags:
        - Invitaciones
      summary: Crear invitación municipal
      description: 'PROPUESTA ADR-0007: el código solo se muestra en esta respuesta y se almacena protegido.'
      operationId: postStaffInvitations
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreatedDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Invitaciones
      summary: Listar invitaciones
      description: Devuelve metadatos, nunca el código original en claro.
      operationId: getStaffInvitations
      x-roles:
        - ADMIN
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff-registrations:
    post:
      tags:
        - Invitaciones
      summary: Canjear invitación
      description: 'PROPUESTA ADR-0007: canje atómico de un solo uso; reglas de elegibilidad por definir.'
      operationId: postAuthStaffRegistrations
      security: []
      x-roles:
        - PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegistrationRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /staff-invitations/{invitationId}/revocations:
    post:
      tags:
        - Invitaciones
      summary: Revocar invitación
      description: Invalida una invitación activa. Operación administrativa auditada.
      operationId: postStaffInvitationsInvitationIdRevocations
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Operación correcta, sin cuerpo de respuesta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      tags:
        - Catálogos
      summary: Listar categories
      description: Catálogo disponible para los clientes autenticados.
      operationId: getCategories
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Catálogos
      summary: Crear categoría
      description: Alta administrativa del catálogo.
      operationId: postCategories
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/{categoryId}:
    get:
      tags:
        - Catálogos
      summary: Consultar categoría
      description: Detalle del elemento de catálogo.
      operationId: getCategoriesCategoryId
      x-roles:
        - AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Catálogos
      summary: Actualizar categoría
      description: Actualización administrativa, sin borrar referencias históricas.
      operationId: patchCategoriesCategoryId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /departments:
    get:
      tags:
        - Catálogos
      summary: Listar departments
      description: Catálogo disponible para los clientes autenticados.
      operationId: getDepartments
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Catálogos
      summary: Crear departamento
      description: Alta administrativa del catálogo.
      operationId: postDepartments
      x-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentWriteRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /departments/{departmentId}:
    get:
      tags:
        - Catálogos
      summary: Consultar departamento
      description: Detalle del elemento de catálogo.
      operationId: getDepartmentsDepartmentId
      x-roles:
        - AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Catálogos
      summary: Actualizar departamento
      description: Actualización administrativa, sin borrar referencias históricas.
      operationId: patchDepartmentsDepartmentId
      x-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentPatchRequest'
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /incidents:
    post:
      tags:
        - Incidencias
      summary: Registrar incidencia
      description: Registra inmediatamente en REPORTED y genera la primera entrada de auditoría. Geocodificación, duplicados, activos y contexto urbano son enriquecimientos opcionales que no bloquean la creación. Las fotografías se adjuntan después.
      operationId: postIncidents
      x-roles:
        - CITIZEN
        - OPERATOR
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDTO'
          headers:
            Location:
              description: Ruta al nuevo recurso, cuando esté disponible.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Incidencias
      summary: Buscar incidencias
      description: Listado paginado. Al ciudadano solo se le muestran incidencias autorizadas; el personal puede usar filtros de búsqueda ampliados.
      operationId: getIncidents
      x-roles:
        - AUTHENTICATED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
          description: Estado.
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
          description: Categoría.
        - name: districtId
          in: query
          required: false
          schema:
            type: string
          description: Distrito.
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
          description: Departamento asignado.
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentPriority'
          description: Prioridad.
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inicio de creación.
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fin de creación.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - createdAt
              - -createdAt
              - priority
              - -priority
          description: Orden permitido.
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /incidents/mine:
    get:
      tags:
        - Incidencias
      summary: Mis incidencias
      description: Solo incidencias creadas por la identidad del JWT; no se acepta userId de terceros.
      operationId: getIncidentsMine
      x-roles:
        - CITIZEN
        - OPERATOR
        - TECHNICIAN
        - ADMIN
