    Page:
      name: page
      in: query
      description: Página a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      description: Fecha inicial inclusive.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Fecha final inclusive.
      schema:
        type: string
        format: date
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Identificador UUID de una asignación de trabajo.
      schema:
        type: string
        format: uuid
    IncidentIfMatch:
      name: If-Match
      in: header
      required: true
      description: Una única ETag fuerte opaca recibida del servidor, sha256 y 64 hexadecimales minúsculos entre comillas. Ausencia 428; detalle obsoleto o carrera de escritura 412; formato no admitido 400 INVALID_IF_MATCH. No admite el formato decimal anterior, wildcard, listas, varias cabeceras ni prefijo W/. La autorización precede a la comparación; no derivar la etiqueta desde version.
      schema:
        type: string
        pattern: ^"sha256-[0-9a-f]{64}"$
        example: '"sha256-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
  responses:
    BadRequest:
      description: JSON mal formado, cuerpo mayor de 16 KiB en los POST de autenticación e invitaciones, tipo de contenido incorrecto o solicitud no interpretable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: JWT ausente/inválido/caducado/revocado, cuenta inactiva o credenciales de login incorrectas; nunca se revela si existe un correo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Permisos insuficientes o recurso no accesible. En rutas protegidas del negocio, el código EMAIL_NOT_VERIFIED indica cuenta no verificada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso inexistente o no visible para este usuario.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Regla de negocio, conflicto de estado, dato duplicado o concurrencia.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: JSON interpretable pero con datos que incumplen reglas de validación, como Bean Validation, o código de verificación inexistente, incorrecto o caducado (INVALID_VERIFICATION_CODE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Se ha superado el límite de solicitudes, determinado en esta primera etapa por la instancia del backend. Aplicado al registro, login, confirmación, reenvío y canje de invitaciones según buckets separados; el cambio de contraseña solo limita el tamaño de cuerpo.
      headers:
        Retry-After:
          description: Segundos recomendados antes de reintentar, cuando se pueda calcular.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: Error inesperado del servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: Servicio temporalmente no disponible. En Autenticación, Usuarios, Invitaciones y catálogos se utiliza ante fallos tipados de conexión/recursos/timeout de PostgreSQL; no indica JWT inválido ni se acompaña de WWW-Authenticate.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Gone:
      description: La cuenta pendiente de verificar ha superado sus 24 horas de vigencia (VERIFICATION_ACCOUNT_EXPIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayloadTooLarge:
      description: El cuerpo bruto de Incidencias supera 65536 bytes; código PAYLOAD_TOO_LARGE. Se rechaza antes de deserializar JSON, incluso sin Content-Length.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PreconditionFailed:
      description: Versión obsoleta o conflicto optimista detectado durante el flush (INCIDENT_VERSION_MISMATCH). La modificación y su auditoría se revierten.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PreconditionRequired:
      description: If-Match obligatorio ausente (IF_MATCH_REQUIRED); se comprueba después del acceso al recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  headers:
    PrivateCache:
      description: Respuesta privada que no debe almacenarse.
      schema:
        type: string
        example: no-store
    IncidentETag:
      description: ETag fuerte opaca SHA-256 del JSON de detalle completo, incluida version y sus recursos proyectados. Enviar sin alterar en If-Match; no derivar de version.
      schema:
        type: string
        pattern: ^"sha256-[0-9a-f]{64}"$
        example: '"sha256-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
