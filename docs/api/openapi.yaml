        - Catálogos
      summary: Listar departments
      description: Catálogo disponible para los clientes autenticados.
      operationId: getDepartments
      x-roles:
        - AUTHENTICATED
      responses:
        '200':
          description: Operación correcta.
          content:
            application/json:
              schema:
                type: array
