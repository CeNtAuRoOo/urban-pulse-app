components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT del backend, según ADR-0005. Roles y permisos se verifican en servidor.
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Identificador URI del tipo de problema.
          example: about:blank
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP asociado.
        code:
          type: string
          description: Código estable para tratamiento programático.
          example: INVALID_TRANSITION
        detail:
          type: string
          description: Explicación sin datos sensibles.
        instance:
          type: string
          description: Ruta de la petición que originó el error.
        requestId:
          type: string
          description: Identificador correlacionable con los registros del servidor.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Errores de campos, cuando corresponda.
      required:
        - title
        - status
        - code
        - detail
      description: Formato de error uniforme inspirado en Problem Details (RFC 9457).
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: Nombre del campo.
        code:
          type: string
          description: Código de validación.
        message:
          type: string
          description: Motivo legible.
      required:
        - field
        - code
        - message
    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 20
        totalItems:
          type: integer
          description: Número total de resultados.
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
    CoordinatesDTO:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          description: Latitud WGS84, grados.
          minimum: -90
          maximum: 90
          example: 36.7213
        longitude:
          type: number
          description: Longitud WGS84, grados.
          minimum: -180
          maximum: 180
          example: -4.4214
        accuracyMeters:
          type: number
          nullable: true
          description: Precisión estimada de la posición en metros.
          minimum: 0
          example: 8
      required:
        - latitude
        - longitude
      description: Coordenadas WGS84 finitas; precisión opcional, finita y no negativa. En entrada accuracyMeters admite null; en salida se omite si no se conoce.
    LocationDTO:
      type: object
      description: Coordenadas implementadas. Los atributos de geocodificación son futuros y se omiten; no se emiten estados ficticios.
      properties:
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        formattedAddress:
          type: string
          description: Futuro; dirección normalizada por un proveedor backend.
          x-implementation: future
        neighborhood:
          type: string
          description: Futuro; nombre del barrio, respaldado por Neighborhood.
          x-implementation: future
        districtId:
          type: string
          format: uuid
          x-implementation: future
        districtName:
          type: string
          x-implementation: future
        geocodingStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - UNAVAILABLE
          description: Futuro; solo se emitirá tras disponer de un proceso real.
          x-implementation: future
      required:
        - coordinates
    IncidentStatus:
      type: string
      enum:
        - REPORTED
        - VALIDATED
        - REJECTED
        - ASSIGNED_TO_DEPARTMENT
        - WORK_ASSIGNED
        - IN_PROGRESS
        - RESOLVED
        - CLOSED
      description: La API actual solo crea REPORTED. Tramitación futura permitirá reabrir RESOLVED directamente a ASSIGNED_TO_DEPARTMENT o WORK_ASSIGNED con trabajo válido y motivo; CLOSED es terminal.
    IncidentPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      description: Ausente hasta una decisión futura de prioridad justificada.
    CreateIncidentRequest:
      type: object
      description: Cuenta activa y verificada como informante desde JWT. Textos con trim() antes de validar puntos Unicode, sin cambiar formato interior ni acentos; no blancos, sin NUL ni sustitutos aislados. No admite atributos calculados. Categoría omitida/null equivale a sin categoría; una UUID proporcionada debe existir y estar activa.
      properties:
        title:
          type: string
          x-normalized-minLength: 5
          x-normalized-maxLength: 150
          description: De 5 a 150 puntos de código después de trim(), no sobre el texto bruto.
        description:
          type: string
          x-normalized-minLength: 10
          x-normalized-maxLength: 5000
          description: De 10 a 5000 puntos de código después de trim(); conserva saltos y espacios interiores.
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        categoryId:
          type: string
          format: uuid
          nullable: true
      required:
        - title
        - description
        - coordinates
      additionalProperties: false
    UpdateIncidentRequest:
      type: object
      description: Titular o, provisionalmente, OPERATOR/ADMIN; solo REPORTED. If-Match obligatorio. Omitir conserva; categoryId:null desclasifica; null en title, description o coordinates produce 400. Coordenadas se sustituyen completas; precisión omitida/null se elimina. Objeto vacío produce 422. No-op conserva versión, fecha e historial. Normalización idéntica al alta.
      properties:
        title:
          type: string
          x-normalized-minLength: 5
          x-normalized-maxLength: 150
        description:
          type: string
          x-normalized-minLength: 10
          x-normalized-maxLength: 5000
        categoryId:
          type: string
          format: uuid
          nullable: true
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
      additionalProperties: false
      minProperties: 1
    IncidentSummaryDTO:
      type: object
      description: Resumen implementado. Los opcionales sin valor se omiten, salvo la description nullable del catálogo CategoryDTO compartido.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        location:
          $ref: '#/components/schemas/LocationDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
        attachmentCount:
          type: integer
          minimum: 0
          description: Futuro; no se devuelve un cero artificial sin módulo de evidencias.
          x-implementation: future
      required:
        - id
        - title
        - status
        - location
        - createdAt
        - updatedAt
        - version
    IncidentDTO:
      type: object
      description: Detalle autorizado. Opcionales sin valor se omiten; no se simulan geocodificación, evidencias, contexto ni asignaciones. CategoryDTO conserva description:null. assignedDepartment representa derivación; currentAssignment será trabajo activo, nunca departamento.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        reporter:
          $ref: '#/components/schemas/UserSummaryDTO'
        category:
          $ref: '#/components/schemas/CategoryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        location:
          $ref: '#/components/schemas/LocationDTO'
        assignedDepartment:
          $ref: '#/components/schemas/DepartmentDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
          description: Versión optimista JPA, distinta del JWT. Participa en la ETag junto al detalle completo; no permite reconstruir la etiqueta.
        prioritySource:
          type: string
          enum:
            - MANUAL
            - ASSISTED
          x-implementation: future
        priorityJustification:
          type: string
          x-implementation: future
        urbanAsset:
          description: Futuro; asociación autorizada con activo urbano.
          x-implementation: future
          allOf:
            - $ref: '#/components/schemas/UrbanAssetAssociationDTO'
        currentAssignment:
          description: Futuro; asignación activa a equipo o técnico.
          x-implementation: future
          allOf:
            - $ref: '#/components/schemas/AssignmentDTO'
        contextStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - PARTIAL
            - UNAVAILABLE
          x-implementation: future
        attachmentCount:
          type: integer
          minimum: 0
          x-implementation: future
      required:
        - id
        - title
        - description
        - reporter
        - status
        - location
        - createdAt
        - updatedAt
        - version
    IncidentPageDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummaryDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - data
        - pagination
    HistoryEventDTO:
      type: object
      description: Proyección pública de AuditEvent, no tabla. Solo CREATED y UPDATED están implementados; los demás tipos son diseño futuro y deberán evitar duplicar transiciones.
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - CREATED
            - UPDATED
            - REVIEWED
            - PRIORITIZED
            - DEPARTMENT_ASSIGNED
            - DEPARTMENT_TRANSFERRED
            - WORK_ASSIGNED
            - WORK_REASSIGNED
            - STATUS_CHANGED
            - COMMENTED
            - ATTACHMENT_ADDED
            - ASSET_LINKED
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserSummaryDTO'
        summary:
          type: string
          description: Texto estable del servidor; nunca el summary arbitrario del evento interno.
        details:
          type: object
          additionalProperties: false
          properties:
            version:
              type: string
              pattern: ^[0-9]{1,19}$
          description: Lista permitida de datos públicos; no replica el JSONB de auditoría.
      required:
        - id
        - eventType
        - occurredAt
        - summary
        - details
    UserSummaryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Ana Pérez
      required:
        - id
        - displayName
      description: Vista mínima de usuario. No revela roles ni pertenencias departamentales en respuestas de incidencias.
    UserDTO:
      type: object
      description: Vista del usuario devuelta en su propio perfil, autenticación y consultas administrativas. Nunca incluye passwordHash ni tokenVersion. Incluye siempre la colección de pertenencias departamentales activas e históricas; las fechas permiten distinguir ambos estados.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
          description: Correo electrónico del usuario autenticado o consultado por un administrador.
        emailVerified:
          type: boolean
          description: Indica si se ha verificado el control del correo. Se inicializa a false en registro; la confirmación por código HMAC ya se implementa en el backend y habilita el acceso de negocio en la siguiente petición.
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          description: Roles GLOBAL concedidos mediante UserRole. Toda cuenta tiene CITIZEN; los roles DEPARTMENT se consultan a través de departmentMemberships.
          items:
            $ref: '#/components/schemas/GlobalRoleCode'
          uniqueItems: true
        departmentMemberships:
          type: array
          description: Adscripciones departamentales activas e históricas. Una pertenencia está activa cuando leftAt es null. Se ordenan por joinedAt descendente e id ascendente. Una pertenencia histórica no concede permisos; roles globales y departamentales son ámbitos distintos.
          items:
            $ref: '#/components/schemas/DepartmentMembershipDTO'
      required:
        - id
        - displayName
        - email
        - emailVerified
        - active
        - createdAt
        - roles
        - departmentMemberships
    UpdateMyProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          x-normalized-minLength: 2
          x-normalized-maxLength: 120
          description: Se recortan espacios Unicode y controles ASCII de borde antes de validar. El resultado debe contener 2–120 puntos de código Unicode y no incluir controles interiores ni sustitutos aislados. Los límites se aplican al texto normalizado; el texto recibido puede incluir espacios de borde adicionales. Error 422 VALIDATION_ERROR.
      required:
        - displayName
      description: Solo admite el nombre público; no permite modificar roles, correo ni pertenencias departamentales.
      additionalProperties: false
    AdminUpdateUserRequest:
      type: object
      properties:
        active:
          type: boolean
      description: Permite activar/desactivar cuentas; la concesión de roles privilegiados utiliza invitaciones (ADR-0007). La baja interna de pertenencias conserva historial; su exposición HTTP requiere contrato propio. No permite desactivar al último ADMIN activo y verificado (409 LAST_ACTIVE_ADMIN). La autodesactivación se permite si permanece otro administrador disponible.
      required:
        - active
      additionalProperties: false
    UsersPageDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - data
        - pagination
    RoleCode:
      type: string
      enum:
        - CITIZEN
        - OPERATOR
        - ADMIN
        - DEPARTMENT_COORDINATOR
        - TECHNICIAN
      description: Catálogo completo de códigos; el ámbito se deduce del código (sin RoleScope persistido). Para DTO por ámbito se emplean GlobalRoleCode y DepartmentRoleCode.
    DepartmentMembershipDTO:
      type: object
      description: Adscripción a departamento con rol DEPARTMENT; solo se facilita a personas autorizadas. Las fechas conservan historial.
      properties:
        department:
          $ref: '#/components/schemas/DepartmentDTO'
        role:
          $ref: '#/components/schemas/DepartmentRoleCode'
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
          nullable: true
      required:
        - department
        - role
        - joinedAt
        - leftAt
    GlobalRoleCode:
      type: string
      enum:
        - CITIZEN
        - OPERATOR
        - ADMIN
      description: Roles globales definidos en ADR-0009. CITIZEN es inherente a toda cuenta; OPERATOR y ADMIN son privilegios adicionales.
    DepartmentRoleCode:
      type: string
      enum:
        - DEPARTMENT_COORDINATOR
        - TECHNICIAN
      description: Roles departamentales; requieren DepartmentMembership activa para actuar.
    RegisterRequest:
      type: object
      description: Alta ciudadana pública; el servidor asigna CITIZEN, crea el código de verificación y mantiene emailVerified=false. El envío SMTP se solicita tras el commit.
      properties:
        displayName:
          type: string
          minLength: 2
          x-normalized-minLength: 2
          x-normalized-maxLength: 120
          description: Se recortan espacios Unicode y controles ASCII de borde antes de validar. El nombre normalizado admite 2–120 puntos Unicode, sin controles interiores ni sustitutos aislados; idéntica regla a PATCH de perfil.
        email:
          type: string
          format: email
          maxLength: 254
          description: Se normaliza mediante trim/minúsculas y se compara sin distinción de mayúsculas según la política de unicidad.
        password:
          type: string
          format: password
          description: Contraseña enviada solo mediante TLS; mínimo 8 caracteres y máximo 72 bytes UTF-8 por BCrypt; jamás se devuelve ni registra.
          minLength: 8
      required:
        - displayName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
      required:
        - email
        - password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      description: La contraseña actual debe coincidir con la almacenada; al cambiarla se invalidan todas las sesiones JWT previas mediante tokenVersion.
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Máximo 72 bytes UTF-8 por BCrypt; se valida en backend.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    ConfirmEmailRequest:
      type: object
      description: Confirmación de correo del titular autenticado mediante código numérico de ocho dígitos ASCII.
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{8}$
          minLength: 8
          maxLength: 8
          example: '01234567'
          description: Secreto de un solo uso, válido como máximo 10 minutos y nunca más allá de las 24 horas desde el registro.
    TokenDTO:
      type: object
      description: Respuesta de registro ciudadano o login; accessToken es un JWT firmado y no cifrado. Una cuenta con emailVerified=false dispone de acceso limitado hasta confirmar su correo.
      properties:
        accessToken:
          type: string
          description: JWT Bearer con claims sub (UUID de usuario), iat, exp, iss y ver (tokenVersion). Los roles no son fuente de autorización dentro del token.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Duración del token de acceso en segundos; versión inicial 7200.
          minimum: 1
          example: 7200
        user:
          $ref: '#/components/schemas/UserDTO'
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
    InvitationRequest:
      oneOf:
        - $ref: '#/components/schemas/GlobalInvitationRequest'
        - $ref: '#/components/schemas/DepartmentInvitationRequest'
      description: El rol selecciona dos variantes disjuntas; el destinatario se registra y verifica por Autenticación.
    InvitationDTO:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - createdBy
        - createdAt
        - expiresAt
      description: Metadatos solo para ADMIN. Nunca contiene código ni HMAC. Los opcionales se omiten, no son null.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
            - OPERATOR
            - ADMIN
            - TECHNICIAN
            - DEPARTMENT_COORDINATOR
        departmentId:
          type: string
          format: uuid
          description: Presente exclusivamente para roles departamentales.
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdBy:
          type: string
          format: uuid
        redeemedBy:
          type: string
          format: uuid
        revokedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    InvitationPageDTO:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvitationDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
    InvitationRedemptionDTO:
      type: object
      additionalProperties: false
      required:
        - invitationId
        - role
        - scope
        - redeemedAt
      properties:
        invitationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - OPERATOR
            - ADMIN
            - TECHNICIAN
            - DEPARTMENT_COORDINATOR
        scope:
          type: string
          enum:
            - GLOBAL
            - DEPARTMENT
        departmentId:
          type: string
          format: uuid
          description: Presente solo para DEPARTMENT; se omite para GLOBAL.
        redeemedAt:
          type: string
          format: date-time
    InvitationRedemptionRequest:
      type: object
      additionalProperties: false
      required:
        - invitationCode
      properties:
        invitationCode:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          description: Código de 256 bits Base64URL canónico sin padding, recibido exclusivamente por correo.
    InvitationStatus:
      type: string
      enum:
        - ACTIVE
        - REDEEMED
        - REVOKED
        - EXPIRED
      description: Derivado de canje, revocación y caducidad; now igual a expiresAt ya es EXPIRED.
    StaffGlobalRoleCode:
      type: string
      enum:
        - OPERATOR
        - ADMIN
    GlobalInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Obligatorio, trim y minúsculas como User.email.
        role:
          $ref: '#/components/schemas/StaffGlobalRoleCode'
      description: No admite departmentId, ni siquiera null, ni expiresAt. Vigencia calculada por el servidor.
    DepartmentInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
        - departmentId
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/DepartmentRoleCode'
        departmentId:
          type: string
          format: uuid
          description: Departamento existente y activo al emitir y al canjear; no admite null.
    CategoryDTO:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nombre recortado, único sin distinguir mayúsculas, incluso si la categoría está inactiva.
          example: Tráfico y semáforos
        description:
          type: string
          nullable: true
          maxLength: 500
        active:
          type: boolean
      required:
        - id
        - name
        - description
        - active
    CategoryWriteRequest:
      description: Nombre obligatorio, no blanco y único sin distinguir mayúsculas, incluidas categorías inactivas. Se aplica trim() antes de validar los límites y persistir, conservando espacios interiores. Los límites cuentan puntos de código Unicode, como PostgreSQL y OpenAPI. Descripción omitida o null se guarda como null, sin recortar su texto. Active omitido o null equivale a true. No existe code. Propiedades desconocidas devuelven 422 UNKNOWN_PROPERTY; datos inválidos, 422 VALIDATION_ERROR; JSON o tipos no interpretables, 400 INVALID_JSON.
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 500
        active:
          type: boolean
          nullable: true
          default: true
      required:
        - name
      additionalProperties: false
    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos. Omitir conserva el valor; null explícito en cualquier campo devuelve 400 INVALID_JSON. Descripción vacía limpia su contenido sin convertirlo en null. Trim() del nombre antes de validar sus límites; conserva espacios interiores. Un objeto vacío devuelve 422 VALIDATION_ERROR. Active false desactiva y true reactiva, conservando UUID y nombre reservado. Los PATCH sobre la misma fila se serializan para preservar cambios en campos omitidos.
      additionalProperties: false
      minProperties: 1
    DepartmentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Movilidad
        code:
          type: string
          description: Código corto único, normalizado a mayúsculas.
          example: MOV
          pattern: ^[A-Z0-9_-]+$
        description:
          type: string
          nullable: true
        active:
          type: boolean
      required:
        - id
        - name
        - code
        - active
    DepartmentWriteRequest:
      description: Se aplica trim a nombre y código antes de validar; se conservan espacios interiores del nombre. Unicidad sin distinguir mayúsculas. Active omitido o null equivale a true.
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        code:
          type: string
          minLength: 2
          maxLength: 20
          pattern: ^[A-Za-z0-9_-]+$
        description:
          type: string
          nullable: true
          maxLength: 500
        active:
          type: boolean
          nullable: true
          default: true
      required:
        - name
        - code
      additionalProperties: false
    DepartmentPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        code:
          type: string
          minLength: 2
          maxLength: 20
          pattern: ^[A-Za-z0-9_-]+$
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos. Omitir conserva el valor; null explícito se rechaza con 400. Descripción vacía borra su contenido. Trim de nombre y código antes de validar; código en mayúsculas. Un objeto vacío devuelve 422. Active false desactiva sin borrar.
      additionalProperties: false
      minProperties: 1
    ReviewRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
        reason:
          type: string
          description: Obligatorio en REJECT y REQUEST_INFORMATION; opcional en VALIDATE. Si se aporta, texto no blanco de 3–2000 puntos Unicode tras trim.
          minLength: 3
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
      required:
        - decision
      oneOf:
        - properties:
            decision:
              enum:
                - VALIDATE
        - properties:
            decision:
              enum:
                - REJECT
                - REQUEST_INFORMATION
          required:
            - reason
      additionalProperties: false
    ReviewDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
        reason:
          type: string
        reviewedBy:
          $ref: '#/components/schemas/UserSummaryDTO'
        reviewedAt:
          type: string
          format: date-time
        resultingStatus:
          $ref: '#/components/schemas/IncidentStatus'
      required:
        - id
        - incidentId
        - decision
        - reviewedBy
        - reviewedAt
        - resultingStatus
    PriorityRequest:
      type: object
      properties:
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        source:
          type: string
          enum:
            - MANUAL
            - ASSISTED
        justification:
          type: string
          description: Texto no blanco de 3–2000 puntos Unicode tras trim; se conserva la justificación manual o asistida.
          minLength: 3
          maxLength: 2000
      required:
        - priority
        - source
        - justification
      additionalProperties: false
    PriorityDecisionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
