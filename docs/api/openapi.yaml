          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT del backend, según ADR-0005. Roles y permisos se verifican en servidor.
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Identificador URI del tipo de problema.
          example: about:blank
        title:
          type: string
          description: Resumen legible del problema.
        status:
          type: integer
          description: Código HTTP asociado.
        code:
          type: string
          description: Código estable para tratamiento programático.
          example: INVALID_TRANSITION
        detail:
          type: string
          description: Explicación sin datos sensibles.
        instance:
          type: string
          description: Ruta de la petición que originó el error.
        requestId:
          type: string
          description: Identificador correlacionable con los registros del servidor.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Errores de campos, cuando corresponda.
      required:
        - title
        - status
        - code
        - detail
      description: Formato de error uniforme inspirado en Problem Details (RFC 9457).
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: Nombre del campo.
        code:
          type: string
          description: Código de validación.
        message:
          type: string
          description: Motivo legible.
      required:
        - field
        - code
        - message
    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 20
        totalItems:
          type: integer
          description: Número total de resultados.
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
    CoordinatesDTO:
      type: object
      properties:
        latitude:
          type: number
          description: Latitud WGS84, grados.
          minimum: -90
          maximum: 90
          example: 36.7213
        longitude:
          type: number
          description: Longitud WGS84, grados.
          minimum: -180
          maximum: 180
          example: -4.4214
        accuracyMeters:
          type: number
          description: Precisión estimada de la posición en metros.
          minimum: 0
          example: 8
      required:
        - latitude
        - longitude
      description: Coordenadas geográficas; la precisión es opcional.
    LocationDTO:
      type: object
      properties:
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        formattedAddress:
          type: string
          description: Dirección normalizada (puede estar ausente si falla la geocodificación).
        neighborhood:
          type: string
          description: Barrio deducido de la posición.
        districtId:
          type: string
          description: Distrito obtenido por geocodificación.
        districtName:
          type: string
          description: Nombre del distrito.
        geocodingStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - UNAVAILABLE
          description: Resultado del enriquecimiento de localización.
      required:
        - coordinates
        - geocodingStatus
    UserSummaryDTO:
      type: object
      properties:
        id:
          type: string
          example: usr_1
        displayName:
          type: string
          example: Ana Pérez
        role:
          $ref: '#/components/schemas/UserRole'
      required:
        - id
        - displayName
        - role
    UserRole:
      type: string
      enum:
        - CITIZEN
        - OPERATOR
        - TECHNICIAN
        - ADMIN
        - ANALYST
      description: Rol asignado por el backend; nunca editable en el registro ciudadano.
    UserDTO:
      type: object
      properties:
        id:
          type: string
          example: usr_1
        displayName:
          type: string
        email:
          type: string
          format: email
          description: Visible únicamente para el titular o personal autorizado.
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - role
        - active
        - createdAt
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Contraseña enviada solo por TLS; jamás se devuelve en DTO.
          minLength: 8
      required:
        - displayName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
      additionalProperties: false
    TokenDTO:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT firmado.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Duración del token en segundos.
          minimum: 1
        user:
          $ref: '#/components/schemas/UserDTO'
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
      description: Solo admite el nombre público; no permite modificar roles.
      additionalProperties: false
    AdminUpdateUserRequest:
      type: object
      properties:
        active:
          type: boolean
        role:
          $ref: '#/components/schemas/UserRole'
      description: Acción administrativa auditable; no utilizar para el registro.
      additionalProperties: false
    InvitationRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        email:
          type: string
          format: email
          description: Correo autorizado opcional; política definitiva pendiente.
        expiresAt:
          type: string
          format: date-time
      required:
        - role
      description: 'PROPUESTA ADR-0007: invitaciones de un solo uso para roles municipales.'
      additionalProperties: false
    InvitationDTO:
      type: object
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - ACTIVE
            - REDEEMED
            - REVOKED
            - EXPIRED
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
        invitationCode:
          type: string
          description: Solo aparece una vez, inmediatamente al crear la invitación; nunca en listados.
      required:
        - id
        - role
        - status
        - createdAt
        - expiresAt
    InvitationCreatedDTO:
      allOf:
        - $ref: '#/components/schemas/InvitationDTO'
        - type: object
          properties:
            invitationCode:
              type: string
              description: Se revela únicamente en la respuesta de creación; no se persiste en claro.
          required:
            - invitationCode
      description: Respuesta de creación de invitación con código entregado una sola vez.
    StaffRegistrationRequest:
      type: object
      properties:
        invitationCode:
          type: string
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
      required:
        - invitationCode
        - displayName
        - email
        - password
      additionalProperties: false
    CategoryDTO:
      type: object
      properties:
        id:
          type: string
          example: cat_traffic
        name:
          type: string
          example: Tráfico y semáforos
        description:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - active
    CategoryWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      required:
        - name
      additionalProperties: false
    CategoryPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos de la categoría.
      additionalProperties: false
      minProperties: 1
    DepartmentDTO:
      type: object
      properties:
        id:
          type: string
          example: dep_mobility
        name:
          type: string
          example: Movilidad
        description:
          type: string
        active:
          type: boolean
      required:
        - id
        - name
        - active
    DepartmentWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      required:
        - name
      additionalProperties: false
    DepartmentPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
      description: Cambia uno o varios atributos del departamento.
      additionalProperties: false
      minProperties: 1
    IncidentStatus:
      type: string
      enum:
        - REPORTED
        - VALIDATED
        - REJECTED
        - ASSIGNED
        - IN_PROGRESS
        - RESOLVED
        - REOPENED
        - CLOSED
      description: Ciclo de vida de una incidencia. Transiciones exactas pendientes de confirmación del equipo.
    IncidentPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
      description: Escala de prioridad propuesta; el enunciado no concreta niveles.
    CreateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          description: Título breve.
          example: Semáforo averiado
          minLength: 5
          maxLength: 150
        description:
          type: string
          description: Descripción detallada.
          example: El semáforo no funciona en el cruce desde esta mañana.
          minLength: 10
          maxLength: 5000
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
        categoryId:
          type: string
          description: Opcional; el sistema puede ayudar a clasificar después.
          example: cat_traffic
      required:
        - title
        - description
        - coordinates
      example:
        title: Semáforo averiado
        description: El semáforo del cruce no funciona desde esta mañana.
        coordinates:
          latitude: 36.7213
          longitude: -4.4214
          accuracyMeters: 8
        categoryId: cat_traffic
      additionalProperties: false
    UpdateIncidentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 10
          maxLength: 5000
        categoryId:
          type: string
        coordinates:
          $ref: '#/components/schemas/CoordinatesDTO'
      description: 'Edición limitada por estado y propiedad; propuesta: titular mientras REPORTED o personal autorizado.'
      additionalProperties: false
    IncidentSummaryDTO:
      type: object
      properties:
        id:
          type: string
          example: inc_001
        title:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        location:
          $ref: '#/components/schemas/LocationDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attachmentCount:
          type: integer
          minimum: 0
      required:
        - id
        - title
        - status
        - location
        - createdAt
        - updatedAt
        - attachmentCount
    IncidentDTO:
      type: object
      properties:
        id:
          type: string
          example: inc_001
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        reporter:
          $ref: '#/components/schemas/UserSummaryDTO'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        prioritySource:
          type: string
          enum:
            - MANUAL
            - ASSISTED
          description: Ausente hasta priorización.
        priorityJustification:
          type: string
        location:
          $ref: '#/components/schemas/LocationDTO'
        urbanAsset:
          $ref: '#/components/schemas/UrbanAssetAssociationDTO'
        currentAssignment:
          $ref: '#/components/schemas/AssignmentDTO'
        contextStatus:
          type: string
          enum:
            - PENDING
            - AVAILABLE
            - PARTIAL
            - UNAVAILABLE
        attachmentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Versión de control de concurrencia; propuesta.
          minimum: 0
      required:
        - id
        - title
        - description
        - status
        - location
        - contextStatus
        - attachmentCount
        - createdAt
        - updatedAt
      description: Detalle. Los datos del informante y campos internos se incluyen solo si el rol/propiedad lo permite.
    IncidentPageDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummaryDTO'
        pagination:
          $ref: '#/components/schemas/PageMetadata'
      required:
        - data
        - pagination
    AttachmentDTO:
      type: object
      properties:
        id:
          type: string
          example: att_123
        incidentId:
          type: string
        fileName:
          type: string
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        sizeBytes:
          type: integer
          minimum: 0
        uploadedBy:
          $ref: '#/components/schemas/UserSummaryDTO'
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          description: Descripción accesible de la fotografía.
      required:
        - id
        - incidentId
        - fileName
        - contentType
        - sizeBytes
        - createdAt
    ReviewRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
        reason:
          type: string
          description: Obligatorio en rechazo o solicitud de información.
          minLength: 3
          maxLength: 2000
        categoryId:
          type: string
          description: Permite confirmar o corregir la clasificación.
      required:
        - decision
      additionalProperties: false
    ReviewDTO:
      type: object
      properties:
        id:
          type: string
        incidentId:
          type: string
        decision:
          type: string
          enum:
            - VALIDATE
            - REJECT
            - REQUEST_INFORMATION
        reason:
          type: string
        reviewedBy:
          $ref: '#/components/schemas/UserSummaryDTO'
        reviewedAt:
          type: string
          format: date-time
        resultingStatus:
          $ref: '#/components/schemas/IncidentStatus'
      required:
        - id
        - incidentId
        - decision
        - reviewedBy
        - reviewedAt
        - resultingStatus
    PriorityRequest:
      type: object
      properties:
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        source:
          type: string
          enum:
            - MANUAL
            - ASSISTED
        justification:
          type: string
          minLength: 3
          maxLength: 2000
        assessmentId:
          type: string
          description: Referencia a evaluación de IA, si aplica.
      required:
        - priority
        - source
        - justification
      additionalProperties: false
    PriorityDecisionDTO:
      type: object
      properties:
        id:
          type: string
        incidentId:
          type: string
        priority:
          $ref: '#/components/schemas/IncidentPriority'
        source:
          type: string
          enum:
            - MANUAL
            - ASSISTED
        justification:
          type: string
        assessmentId:
          type: string
        decidedBy:
          $ref: '#/components/schemas/UserSummaryDTO'
        decidedAt:
          type: string
          format: date-time
      required:
        - id
        - incidentId
        - priority
        - source
        - justification
        - decidedBy
        - decidedAt
    AssignmentRequest:
      type: object
      properties:
        departmentId:
          type: string
        technicianId:
          type: string
          description: Opcional.
        teamId:
          type: string
          description: Opcional. Se formalizará al definir equipos.
        reason:
          type: string
          maxLength: 1000
