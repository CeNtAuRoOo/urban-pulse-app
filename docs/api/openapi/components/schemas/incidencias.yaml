LocationDTO:
  type: object
  properties:
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
    formattedAddress:
      type: string
      description: Dirección normalizada (puede estar ausente si falla la geocodificación).
    neighborhood:
      type: string
      description: Barrio deducido de la posición.
    districtId:
      type: string
      description: Distrito obtenido por geocodificación.
      format: uuid
    districtName:
      type: string
      description: Nombre del distrito.
    geocodingStatus:
      type: string
      enum:
        - PENDING
        - AVAILABLE
        - UNAVAILABLE
      description: Resultado del enriquecimiento de localización.
  required:
    - coordinates
    - geocodingStatus

IncidentStatus:
  type: string
  enum:
    - REPORTED
    - VALIDATED
    - REJECTED
    - ASSIGNED_TO_DEPARTMENT
    - WORK_ASSIGNED
    - IN_PROGRESS
    - RESOLVED
    - REOPENED
    - CLOSED
  description: 'ADR-0010: validación y derivación pueden estar separadas; el trabajo se distribuye después.
    La matriz completa de transiciones permanece pendiente.'

IncidentPriority:
  type: string
  enum:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
  description: Escala acordada para UrbanPulse; LOW, MEDIUM, HIGH, CRITICAL.

CreateIncidentRequest:
  type: object
  properties:
    title:
      type: string
      description: Título breve.
      minLength: 5
      maxLength: 150
    description:
      type: string
      description: Descripción detallada.
      minLength: 10
      maxLength: 5000
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
    categoryId:
      type: string
      format: uuid
      description: Categoría opcional; puede decidirse durante revisión.
  required:
    - title
    - description
    - coordinates
  additionalProperties: false

UpdateIncidentRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 5
      maxLength: 150
    description:
      type: string
      minLength: 10
      maxLength: 5000
    categoryId:
      type: string
      format: uuid
      description: Categoría opcional; puede decidirse durante revisión.
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
  description: "Edición limitada por estado y propiedad; propuesta: titular mientras REPORTED o personal autorizado."
  additionalProperties: false

IncidentSummaryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    category:
      $ref: "./catalogos.yaml#/CategoryDTO"
    status:
      $ref: "./incidencias.yaml#/IncidentStatus"
    priority:
      $ref: "./incidencias.yaml#/IncidentPriority"
    location:
      $ref: "./incidencias.yaml#/LocationDTO"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    attachmentCount:
      type: integer
      minimum: 0
  required:
    - id
    - title
    - status
    - location
    - createdAt
    - updatedAt
    - attachmentCount

IncidentDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    description:
      type: string
    category:
      $ref: "./catalogos.yaml#/CategoryDTO"
    reporter:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    status:
      $ref: "./incidencias.yaml#/IncidentStatus"
    priority:
      $ref: "./incidencias.yaml#/IncidentPriority"
    prioritySource:
      type: string
      enum:
        - MANUAL
        - ASSISTED
      description: Ausente hasta priorización.
    priorityJustification:
      type: string
    location:
      $ref: "./incidencias.yaml#/LocationDTO"
    urbanAsset:
      $ref: "./contexto-urbano.yaml#/UrbanAssetAssociationDTO"
    currentAssignment:
      $ref: "./tramitacion.yaml#/AssignmentDTO"
    contextStatus:
      type: string
      enum:
        - PENDING
        - AVAILABLE
        - PARTIAL
        - UNAVAILABLE
    attachmentCount:
      type: integer
      minimum: 0
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    resolvedAt:
      type: string
      format: date-time
    closedAt:
      type: string
      format: date-time
    version:
      type: integer
      description: Versión de control de concurrencia; propuesta.
      minimum: 0
    assignedDepartment:
      $ref: ./catalogos.yaml#/DepartmentDTO
  required:
    - id
    - title
    - description
    - status
    - location
    - contextStatus
    - attachmentCount
    - createdAt
    - updatedAt
  description: El departamento actual se devuelve en assignedDepartment; currentAssignment representa 
    solamente trabajo activo (ADR-0010).

IncidentPageDTO:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "./incidencias.yaml#/IncidentSummaryDTO"
    pagination:
      $ref: "./comunes.yaml#/PageMetadata"
  required:
    - data
    - pagination

HistoryEventDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    eventType:
      type: string
      enum:
        - CREATED
        - REVIEWED
        - PRIORITIZED
        - DEPARTMENT_ASSIGNED
        - DEPARTMENT_TRANSFERRED
        - WORK_ASSIGNED
        - WORK_REASSIGNED
        - STATUS_CHANGED
        - COMMENTED
        - ATTACHMENT_ADDED
        - ASSET_LINKED
    occurredAt:
      type: string
      format: date-time
    actor:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    summary:
      type: string
    details:
      type: object
      additionalProperties: true
      description: Datos públicos o internos según permisos; sin información sensible.
  required:
    - id
    - eventType
    - occurredAt
    - summary
