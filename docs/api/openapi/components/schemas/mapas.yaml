MapFeatureDTO:
  type: object
  properties:
    incidentId:
      type: string
      format: uuid
    title:
      type: string
    status:
      $ref: "./incidencias.yaml#/IncidentStatus"
    priority:
      $ref: "./incidencias.yaml#/IncidentPriority"
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
    categoryId:
      type: string
      format: uuid
  required:
  - incidentId
  - title
  - status
  - coordinates

MapIncidentsDTO:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "./mapas.yaml#/MapFeatureDTO"
    count:
      type: integer
      minimum: 0
  required:
  - items
  - count
