# =============================================================================
# components/schemas/contexto-urbano.yaml
# Schemas del dominio Contexto urbano.
# Estructura PLANA en la raíz del archivo (claves de schema directas), para
# que `bundle` los inserte en components.schemas y reescriba $refs internos.
# =============================================================================

UrbanAssetRecordDTO:
  type: object
  description: >-
    Registro del catálogo PostGIS cartografia.contexto_urbano devuelto por
    GET /urban-assets. geom es WKT sin prefijo SRID; el SRID del contrato es 25830.
    Implementado en la migración Flyway V2 (PostGIS + cartografia.contexto_urbano).
  properties:
    id:
      type: integer
      format: int64
    sourceTable:
      type: string
      maxLength: 64
      description: Nombre de la tabla/conjunto de origen.
    name:
      type: string
      nullable: true
    category:
      type: string
      nullable: true
      description: Metadato de origen; los valores actuales pueden no estar normalizados.
    description:
      type: string
      nullable: true
    address:
      type: string
      nullable: true
    phone:
      type: string
      nullable: true
    email:
      type: string
      nullable: true
    url:
      type: string
      nullable: true
    geom:
      type: string
      description: Geometría en WKT, coordenadas métricas EPSG:25830, sin prefijo SRID.
  required:
    - id
    - sourceTable
    - geom

UrbanAssetDTO:
  type: object
  description: >-
    Activo urbano local: id UUID interno; externalId identifica al activo en un
    proveedor. Relación sourceId opcional, integración aún provisional.
    Esquema CONCEPTUAL del modelo objetivo; el endpoint implementado
    GET /urban-assets devuelve UrbanAssetRecordDTO.
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      example: BUS_STOP
    name:
      type: string
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
    metadata:
      type: object
      additionalProperties: true
      description: Metadatos heterogéneos del proveedor.
    sourceId:
      type: string
      format: uuid
      description: Identificador de ExternalSource cuando existe fuente registrada; asociación opcional.
    externalId:
      type: string
      description: Identificador original del activo en su fuente; no equivale al UUID interno.
  required:
    - id
    - type
    - coordinates
    - externalId

UrbanAssetCandidateDTO:
  type: object
  properties:
    asset:
      $ref: "#/UrbanAssetDTO" # ← interno, sin './contexto-urbano.yaml'
    distanceMeters:
      type: number
      minimum: 0
      example: 7
    confidence:
      type: number
      minimum: 0
      maximum: 1
      example: 0.87
  required:
    - asset
    - distanceMeters
    - confidence

UrbanAssetAssociationRequest:
  type: object
  properties:
    assetId:
      type: string
      format: uuid
    reason:
      type: string
      maxLength: 2000
  required:
    - assetId
  additionalProperties: false

UrbanAssetAssociationDTO:
  type: object
  properties:
    asset:
      $ref: "#/UrbanAssetDTO" # ← interno
    distanceMeters:
      type: number
      minimum: 0
    confidence:
      type: number
      minimum: 0
      maximum: 1
    associationMethod:
      type: string
      enum:
        - INFERRED
        - EXPLICIT
        - OPERATOR_CONFIRMED
    confirmedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    associatedAt:
      type: string
      format: date-time
  required:
    - asset
    - associationMethod
    - associatedAt

ExternalObservationDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    sourceId:
      type: string
      format: uuid
    metric:
      type: string
      example: temperature
    value:
      oneOf:
        - type: number
        - type: string
        - type: boolean
    unit:
      type: string
      example: C
    quality:
      type: string
      enum:
        - GOOD
        - ESTIMATED
        - UNKNOWN
        - POOR
    status:
      type: string
      enum:
        - CURRENT
        - STALE
        - UNAVAILABLE
    observedAt:
      type: string
      format: date-time
    ingestedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    coordinates:
      $ref: "./comunes.yaml#/CoordinatesDTO"
  required:
    - id
    - sourceId
    - metric
    - value
    - quality
    - status
    - observedAt
    - ingestedAt

UrbanContextDTO:
  type: object
  description: >-
    La falta de proveedores externos no impide registrar incidencias ni provoca
    un error del reporte.
  properties:
    incidentId:
      type: string
      format: uuid
    status:
      type: string
      enum:
        - PENDING
        - AVAILABLE
        - PARTIAL
        - UNAVAILABLE
    generatedAt:
      type: string
      format: date-time
    observations:
      type: array
      items:
        $ref: "#/ExternalObservationDTO" # ← interno
    nearbyAssets:
      type: array
      items:
        $ref: "#/UrbanAssetCandidateDTO" # ← interno
    warnings:
      type: array
      items:
        type: string
      description: Fuentes que no pudieron aportar datos.
  required:
    - incidentId
    - status
    - generatedAt
    - observations
    - nearbyAssets
    - warnings
