UserSummaryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
      example: Ana Pérez
  required:
  - id
  - displayName
  description: Vista mínima de usuario. No revela roles ni pertenencias departamentales en respuestas de 
    incidencias.
UserDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
    email:
      type: string
      format: email
      description: Visible únicamente para el titular o personal autorizado.
    active:
      type: boolean
    createdAt:
      type: string
      format: date-time
    roles:
      type: array
      description: Roles GLOBAL concedidos mediante UserRole. Los roles DEPARTMENT se consultan a través 
        de departmentMemberships.
      items:
        $ref: ./usuarios.yaml#/GlobalRoleCode
      uniqueItems: true
    departmentMemberships:
      type: array
      description: Adscripciones departamentales, visibles según autorización.
      items:
        $ref: ./usuarios.yaml#/DepartmentMembershipDTO
  required:
  - id
  - displayName
  - active
  - createdAt

  - roles
UpdateProfileRequest:
  type: object
  properties:
    displayName:
      type: string
      minLength: 2
      maxLength: 120
  description: Solo admite el nombre público; no permite modificar roles.
  additionalProperties: false

AdminUpdateUserRequest:
  type: object
  properties:
    active:
      type: boolean
  description: Permite activar/desactivar cuentas; la concesión de roles privilegiados utiliza 
    invitaciones (ADR-0007). Revocación y gestión de pertenencias requieren contrato propio cuando se 
    implementen.
  additionalProperties: false

  minProperties: 1
UsersPageDTO:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "./usuarios.yaml#/UserDTO"
    pagination:
      $ref: "./comunes.yaml#/PageMetadata"
  required:
  - data
  - pagination
RoleCode:
  type: string
  enum:
  - CITIZEN
  - OPERATOR
  - ADMIN
  - DEPARTMENT_COORDINATOR
  - TECHNICIAN
  description: 'Catálogo completo de roles; para usos por ámbito se emplean GlobalRoleCode y DepartmentRoleCode.'
RoleScope:
  type: string
  enum:
  - GLOBAL
  - DEPARTMENT
DepartmentMembershipDTO:
  type: object
  description: Adscripción a departamento con rol DEPARTMENT; solo se facilita a personas autorizadas. 
    Las fechas conservan historial.
  properties:
    department:
      $ref: ./catalogos.yaml#/DepartmentDTO
    role:
      $ref: ./usuarios.yaml#/DepartmentRoleCode
    joinedAt:
      type: string
      format: date-time
    leftAt:
      type: string
      format: date-time
  required:
  - department
  - role
  - joinedAt
GlobalRoleCode:
  type: string
  enum:
  - CITIZEN
  - OPERATOR
  - ADMIN
  description: Roles globales definidos en ADR-0009; no implican pertenencia departamental.
DepartmentRoleCode:
  type: string
  enum:
  - DEPARTMENT_COORDINATOR
  - TECHNICIAN
  description: 'Roles departamentales: requieren DepartmentMembership activa para actuar.'
