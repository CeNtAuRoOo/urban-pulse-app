UserSummaryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
      example: Ana Pérez
  required:
    - id
    - displayName
  description: Vista mínima de usuario. No revela roles ni pertenencias departamentales en respuestas de incidencias.

UserDTO:
  type: object
  description: >-
    Vista autorizada del usuario. En registro y login se devuelve el perfil del propio titular;
    jamás incluye passwordHash ni tokenVersion. email y departmentMemberships se exponen
    solo cuando el solicitante tenga permiso. No constituye un mecanismo de fields dinámico.
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
    email:
      type: string
      format: email
      description: Visible únicamente para el titular o personal autorizado.
    emailVerified:
      type: boolean
      description: >-
        Indica si se ha verificado el control del correo. Se inicializa a false en registro;
        la verificación obligatoria mediante email es una funcionalidad futura.
    active:
      type: boolean
    createdAt:
      type: string
      format: date-time
    roles:
      type: array
      description: >-
        Roles GLOBAL concedidos mediante UserRole. Toda cuenta tiene CITIZEN;
        los roles DEPARTMENT se consultan a través de departmentMemberships.
      items:
        $ref: ./usuarios.yaml#/GlobalRoleCode
      uniqueItems: true
    departmentMemberships:
      type: array
      description: Adscripciones departamentales, visibles según autorización.
      items:
        $ref: ./usuarios.yaml#/DepartmentMembershipDTO
  required:
    - id
    - displayName
    - emailVerified
    - active
    - createdAt
    - roles

UpdateProfileRequest:
  type: object
  properties:
    displayName:
      type: string
      minLength: 2
      maxLength: 120
  description: Solo admite el nombre público; no permite modificar roles.
  additionalProperties: false

AdminUpdateUserRequest:
  type: object
  properties:
    active:
      type: boolean
  description: >-
    Permite activar/desactivar cuentas; la concesión de roles privilegiados utiliza
    invitaciones (ADR-0007). Revocación y gestión de pertenencias requieren contrato propio.
  additionalProperties: false
  minProperties: 1

UsersPageDTO:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "./usuarios.yaml#/UserDTO"
    pagination:
      $ref: "./comunes.yaml#/PageMetadata"
  required:
    - data
    - pagination

RoleCode:
  type: string
  enum:
    - CITIZEN
    - OPERATOR
    - ADMIN
    - DEPARTMENT_COORDINATOR
    - TECHNICIAN
  description: Catálogo completo de códigos; el ámbito se deduce del código (sin RoleScope persistido). Para DTO por ámbito se emplean GlobalRoleCode y DepartmentRoleCode.
DepartmentMembershipDTO:
  type: object
  description: Adscripción a departamento con rol DEPARTMENT; solo se facilita a personas autorizadas. Las fechas conservan historial.
  properties:
    department:
      $ref: ./catalogos.yaml#/DepartmentDTO
    role:
      $ref: ./usuarios.yaml#/DepartmentRoleCode
    joinedAt:
      type: string
      format: date-time
    leftAt:
      type: string
      format: date-time
  required:
    - department
    - role
    - joinedAt
GlobalRoleCode:
  type: string
  enum:
    - CITIZEN
    - OPERATOR
    - ADMIN
  description: >-
    Roles globales definidos en ADR-0009. CITIZEN es inherente a toda cuenta;
    OPERATOR y ADMIN son privilegios adicionales.
DepartmentRoleCode:
  type: string
  enum:
    - DEPARTMENT_COORDINATOR
    - TECHNICIAN
  description: Roles departamentales; requieren DepartmentMembership activa para actuar.
