UserSummaryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
      example: Ana Pérez
  required:
    - id
    - displayName
  description: Vista mínima de usuario. No revela roles ni pertenencias departamentales en respuestas de incidencias.

UserDTO:
  type: object
  description: >-
    Vista del usuario devuelta en su propio perfil, autenticación y consultas administrativas.
    Nunca incluye passwordHash ni tokenVersion. Incluye siempre la colección de pertenencias
    departamentales activas e históricas; las fechas permiten distinguir ambos estados.
  properties:
    id:
      type: string
      format: uuid
    displayName:
      type: string
    email:
      type: string
      format: email
      description: Correo electrónico del usuario autenticado o consultado por un administrador.
    emailVerified:
      type: boolean
      description: >-
        Indica si se ha verificado el control del correo. Se inicializa a false en registro;
        la confirmación por código HMAC ya se implementa en el backend y habilita el acceso de negocio en la siguiente petición.
    active:
      type: boolean
    createdAt:
      type: string
      format: date-time
    roles:
      type: array
      description: >-
        Roles GLOBAL concedidos mediante UserRole. Toda cuenta tiene CITIZEN;
        los roles DEPARTMENT se consultan a través de departmentMemberships.
      items:
        $ref: ./usuarios.yaml#/GlobalRoleCode
      uniqueItems: true
    departmentMemberships:
      type: array
      description: >-
        Adscripciones departamentales activas e históricas. Una pertenencia está activa
        cuando leftAt es null. Se ordenan por fecha de alta descendente.
      items:
        $ref: ./usuarios.yaml#/DepartmentMembershipDTO
  required:
    - id
    - displayName
    - email
    - emailVerified
    - active
    - createdAt
    - roles
    - departmentMemberships

UpdateMyProfileRequest:
  type: object
  properties:
    displayName:
      type: string
      minLength: 2
      maxLength: 120
      pattern: '.*\S.*'
      description: No puede estar vacío ni contener únicamente espacios.
  required:
    - displayName
  description: Solo admite el nombre público; no permite modificar roles, correo ni pertenencias departamentales.
  additionalProperties: false

AdminUpdateUserRequest:
  type: object
  properties:
    active:
      type: boolean
  description: >-
    Permite activar/desactivar cuentas; la concesión de roles privilegiados utiliza
    invitaciones (ADR-0007). Revocación y gestión de pertenencias requieren contrato propio.
  required:
    - active
  additionalProperties: false

UsersPageDTO:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "./usuarios.yaml#/UserDTO"
    pagination:
      $ref: "./comunes.yaml#/PageMetadata"
  required:
    - data
    - pagination

RoleCode:
  type: string
  enum:
    - CITIZEN
    - OPERATOR
    - ADMIN
    - DEPARTMENT_COORDINATOR
    - TECHNICIAN
  description: Catálogo completo de códigos; el ámbito se deduce del código (sin RoleScope persistido). Para DTO por ámbito se emplean GlobalRoleCode y DepartmentRoleCode.
DepartmentMembershipDTO:
  type: object
  description: Adscripción a departamento con rol DEPARTMENT; solo se facilita a personas autorizadas. Las fechas conservan historial.
  properties:
    department:
      $ref: ./catalogos.yaml#/DepartmentDTO
    role:
      $ref: ./usuarios.yaml#/DepartmentRoleCode
    joinedAt:
      type: string
      format: date-time
    leftAt:
      type: string
      format: date-time
      nullable: true
  required:
    - department
    - role
    - joinedAt
GlobalRoleCode:
  type: string
  enum:
    - CITIZEN
    - OPERATOR
    - ADMIN
  description: >-
    Roles globales definidos en ADR-0009. CITIZEN es inherente a toda cuenta;
    OPERATOR y ADMIN son privilegios adicionales.
DepartmentRoleCode:
  type: string
  enum:
    - DEPARTMENT_COORDINATOR
    - TECHNICIAN
  description: Roles departamentales; requieren DepartmentMembership activa para actuar.