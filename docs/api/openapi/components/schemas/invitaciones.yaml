InvitationRequest:
  oneOf:
    - $ref: ./invitaciones.yaml#/GlobalInvitationRequest
    - $ref: ./invitaciones.yaml#/DepartmentInvitationRequest
  description: >-
    ADR-0007/0009: el ámbito determina si se exige departmentId.
    Los roles globales invitables son OPERATOR y ADMIN, nunca CITIZEN;
    CITIZEN es inherente a toda cuenta.
InvitationDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    role:
      $ref: ./usuarios.yaml#/RoleCode
    email:
      type: string
      format: email
    status:
      type: string
      enum:
        - ACTIVE
        - REDEEMED
        - REVOKED
        - EXPIRED
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    redeemedAt:
      type: string
      format: date-time
    departmentId:
      type: string
      format: uuid
      description: Departamento destinatario; obligatorio para roles DEPARTMENT y ausente para roles GLOBAL.
  required:
    - id
    - role
    - status
    - createdAt
    - expiresAt
  description: Metadatos de invitación; el código se revela solo en InvitationCreatedDTO.
InvitationCreatedDTO:
  allOf:
    - $ref: "./invitaciones.yaml#/InvitationDTO"
    - type: object
      properties:
        invitationCode:
          type: string
          description: Solo se revela al crear una invitación; nunca se almacena en claro.
      required:
        - invitationCode
  description: Código entregado una sola vez.
StaffRegistrationRequest:
  type: object
  properties:
    invitationCode:
      type: string
    displayName:
      type: string
      minLength: 2
      maxLength: 120
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
  required:
    - invitationCode
    - displayName
    - email
    - password
  additionalProperties: false
  description: >-
    Alta de cuenta nueva con invitación; asignar CITIZEN además de los privilegios
    invitados. Si el email ya pertenece a una cuenta, utilizar canje autenticado
    sin crear otro User. Política de verificación de correo pendiente.
ExistingAccountInvitationRedemptionRequest:
  type: object
  properties:
    invitationCode:
      type: string
  required:
    - invitationCode
  additionalProperties: false
StaffGlobalRoleCode:
  type: string
  enum:
    - OPERATOR
    - ADMIN
  description: Roles globales privilegiados que pueden otorgarse mediante invitación.
GlobalInvitationRequest:
  type: object
  properties:
    role:
      $ref: ./invitaciones.yaml#/StaffGlobalRoleCode
    email:
      type: string
      format: email
      description: Correo autorizado opcional; política definitiva pendiente.
    expiresAt:
      type: string
      format: date-time
  required:
    - role
  additionalProperties: false
  description: Invitación para rol global de personal (OPERATOR o ADMIN); no admite departmentId ni CITIZEN.
DepartmentInvitationRequest:
  type: object
  properties:
    role:
      $ref: ./usuarios.yaml#/DepartmentRoleCode
    departmentId:
      type: string
      format: uuid
      description: Departamento de adscripción al canjear la invitación.
    email:
      type: string
      format: email
      description: Correo autorizado opcional; política definitiva pendiente.
    expiresAt:
      type: string
      format: date-time
  required:
    - role
    - departmentId
  additionalProperties: false
  description: Invitación para rol departamental; requiere departmentId. La cuenta conserva también CITIZEN.
