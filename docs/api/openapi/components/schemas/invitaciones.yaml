InvitationRequest:
  oneOf:
    - $ref: "./invitaciones.yaml#/GlobalInvitationRequest"
    - $ref: "./invitaciones.yaml#/DepartmentInvitationRequest"
  description: El rol selecciona dos variantes disjuntas; el destinatario se registra y verifica por Autenticación.
StaffGlobalRoleCode:
  type: string
  enum: [OPERATOR, ADMIN]
InvitationStatus:
  type: string
  enum: [ACTIVE, REDEEMED, REVOKED, EXPIRED]
  description: Derivado de canje, revocación y caducidad; now igual a expiresAt ya es EXPIRED.
GlobalInvitationRequest:
  type: object
  additionalProperties: false
  required: [email, role]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      description: Obligatorio, trim y minúsculas como User.email.
    role:
      $ref: "./invitaciones.yaml#/StaffGlobalRoleCode"
  description: No admite departmentId, ni siquiera null, ni expiresAt. Vigencia calculada por el servidor.
DepartmentInvitationRequest:
  type: object
  additionalProperties: false
  required: [email, role, departmentId]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    role:
      $ref: "./usuarios.yaml#/DepartmentRoleCode"
    departmentId:
      type: string
      format: uuid
      description: Departamento existente y activo al emitir y al canjear; no admite null.
InvitationRedemptionRequest:
  type: object
  additionalProperties: false
  required: [invitationCode]
  properties:
    invitationCode:
      type: string
      writeOnly: true
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: Código de 256 bits Base64URL canónico sin padding, recibido exclusivamente por correo.
InvitationDTO:
  type: object
  additionalProperties: false
  required: [id, email, role, status, createdBy, createdAt, expiresAt]
  description: Metadatos solo para ADMIN. Nunca contiene código ni HMAC. Los opcionales se omiten, no son null.
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
      maxLength: 254
    role:
      type: string
      enum: [OPERATOR, ADMIN, TECHNICIAN, DEPARTMENT_COORDINATOR]
    departmentId:
      type: string
      format: uuid
      description: Presente exclusivamente para roles departamentales.
    status:
      $ref: "./invitaciones.yaml#/InvitationStatus"
    createdBy:
      type: string
      format: uuid
    redeemedBy:
      type: string
      format: uuid
    revokedBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    redeemedAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
InvitationPageDTO:
  type: object
  additionalProperties: false
  required: [data, pagination]
  properties:
    data:
      type: array
      items:
        $ref: "./invitaciones.yaml#/InvitationDTO"
    pagination:
      $ref: "./comunes.yaml#/PageMetadata"
InvitationRedemptionDTO:
  type: object
  additionalProperties: false
  required: [invitationId, role, scope, redeemedAt]
  properties:
    invitationId:
      type: string
      format: uuid
    role:
      type: string
      enum: [OPERATOR, ADMIN, TECHNICIAN, DEPARTMENT_COORDINATOR]
    scope:
      type: string
      enum: [GLOBAL, DEPARTMENT]
    departmentId:
      type: string
      format: uuid
      description: Presente solo para DEPARTMENT; se omite para GLOBAL.
    redeemedAt:
      type: string
      format: date-time
