CategoryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: Tráfico y semáforos
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - name
    - active

CategoryWriteRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  required:
    - name
  additionalProperties: false

CategoryPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos de la categoría.
  additionalProperties: false
  minProperties: 1

DepartmentDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: Movilidad
    code:
      type: string
      description: Código corto estable del departamento.
      example: MOV
      pattern: '^[A-Z0-9_-]+$'
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - name
    - code
    - active

DepartmentWriteRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    code:
      type: string
      minLength: 2
      maxLength: 20
      pattern: '^[A-Za-z0-9_-]+$'
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  required:
    - name
    - code
  additionalProperties: false

DepartmentPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    code:
      type: string
      minLength: 2
      maxLength: 20
      pattern: '^[A-Za-z0-9_-]+$'
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos del departamento.
  additionalProperties: false
  minProperties: 1
