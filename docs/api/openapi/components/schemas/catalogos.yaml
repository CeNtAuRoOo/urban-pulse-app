CategoryDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: Tráfico y semáforos
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - name
    - active

CategoryWriteRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  required:
    - name
  additionalProperties: false

CategoryPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos de la categoría.
  additionalProperties: false
  minProperties: 1

DepartmentDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: Movilidad
    code:
      type: string
      description: Código corto único, normalizado a mayúsculas.
      example: MOV
      pattern: '^[A-Z0-9_-]+$'
    description:
      type: string
      nullable: true
    active:
      type: boolean
  required:
    - id
    - name
    - code
    - active

DepartmentWriteRequest:
  description: Se aplica trim a nombre y código antes de validar; se conservan espacios interiores del nombre. Unicidad sin distinguir mayúsculas. Active omitido o null equivale a true.
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    code:
      type: string
      minLength: 2
      maxLength: 20
      pattern: '^[A-Za-z0-9_-]+$'
    description:
      type: string
      nullable: true
      maxLength: 500
    active:
      type: boolean
      nullable: true
      default: true
  required:
    - name
    - code
  additionalProperties: false

DepartmentPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    code:
      type: string
      minLength: 2
      maxLength: 20
      pattern: '^[A-Za-z0-9_-]+$'
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos. Omitir conserva el valor; null explícito se rechaza con 400. Descripción vacía borra su contenido. Trim de nombre y código antes de validar; código en mayúsculas. Un objeto vacío devuelve 422. Active false desactiva sin borrar.
  additionalProperties: false
  minProperties: 1
