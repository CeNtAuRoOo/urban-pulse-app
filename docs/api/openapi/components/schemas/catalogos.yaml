CategoryDTO:
  type: object
  properties:
    id:
      type: string
      example: cat_traffic
    name:
      type: string
      example: Tráfico y semáforos
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - name
    - active

CategoryWriteRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  required:
    - name
  additionalProperties: false

CategoryPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 100
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos de la categoría.
  additionalProperties: false
  minProperties: 1

DepartmentDTO:
  type: object
  properties:
    id:
      type: string
      example: dep_mobility
    name:
      type: string
      example: Movilidad
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - name
    - active

DepartmentWriteRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  required:
    - name
  additionalProperties: false

DepartmentPatchRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    description:
      type: string
      maxLength: 500
    active:
      type: boolean
  description: Cambia uno o varios atributos del departamento.
  additionalProperties: false
  minProperties: 1
