DuplicateSuggestionDTO:
  type: object
  properties:
    score:
      type: number
      description: Puntuación de similitud heurística; no es una probabilidad calibrada ni una decisión 
        automática.
      minimum: 0
      maximum: 1
    reasons:
      type: array
      items:
        type: string
      description: Proximidad, tiempo y/o semántica.
    candidateIncidentId:
      type: string
      format: uuid
  required:
    - candidateIncidentId
    - score
    - reasons
  description: DTO calculado por proximidad espacial/temporal, sin almacenamiento ni confirmación 
    automática.
DuplicateLinkRequest:
  type: object
  properties:
    candidateIncidentId:
      type: string
      format: uuid
    reason:
      type: string
  required:
    - candidateIncidentId
  additionalProperties: false

DuplicateLinkDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    candidateIncidentId:
      type: string
      format: uuid
    linkedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    linkedAt:
      type: string
      format: date-time
  required:
    - id
    - incidentId
    - candidateIncidentId
    - linkedAt
    - linkedBy
  description: Relación confirmada por persona autorizada, sin eliminar reportes originales.
