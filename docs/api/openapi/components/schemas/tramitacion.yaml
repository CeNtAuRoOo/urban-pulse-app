ReviewRequest:
  type: object
  properties:
    decision:
      type: string
      enum:
      - VALIDATE
      - REJECT
      - REQUEST_INFORMATION
    reason:
      type: string
      description: Obligatorio en rechazo o solicitud de información.
      minLength: 3
      maxLength: 2000
    categoryId:
      type: string
      format: uuid
  required:
  - decision
  additionalProperties: false

ReviewDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    decision:
      type: string
      enum:
      - VALIDATE
      - REJECT
      - REQUEST_INFORMATION
    reason:
      type: string
    reviewedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    reviewedAt:
      type: string
      format: date-time
    resultingStatus:
      $ref: "./incidencias.yaml#/IncidentStatus"
  required:
  - id
  - incidentId
  - decision
  - reviewedBy
  - reviewedAt
  - resultingStatus

PriorityRequest:
  type: object
  properties:
    priority:
      $ref: "./incidencias.yaml#/IncidentPriority"
    source:
      type: string
      enum:
      - MANUAL
      - ASSISTED
    justification:
      type: string
      minLength: 3
      maxLength: 2000
  required:
  - priority
  - source
  - justification
  additionalProperties: false

PriorityDecisionDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    priority:
      $ref: "./incidencias.yaml#/IncidentPriority"
    source:
      type: string
      enum:
      - MANUAL
      - ASSISTED
    justification:
      type: string
    decidedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    decidedAt:
      type: string
      format: date-time
  required:
  - id
  - incidentId
  - priority
  - source
  - justification
  - decidedBy
  - decidedAt

AssignmentRequest:
  oneOf:
  - $ref: ./tramitacion.yaml#/TeamWorkAssignmentRequest
  - $ref: ./tramitacion.yaml#/TechnicianWorkAssignmentRequest
  description: 'ADR-0010: solo después de derivar a un departamento; exactamente uno de teamId o technicianId.
    Coordinador autorizado del mismo departamento. Reasignar cierra el trabajo previo y crea otro.'
AssignmentDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    technician:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    teamId:
      type: string
      format: uuid
    assignedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    reason:
      type: string
    assignedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    acceptedBy:
      $ref: ./usuarios.yaml#/UserSummaryDTO
    acceptedAt:
      type: string
      format: date-time
  required:
  - id
  - incidentId
  - assignedBy
  - assignedAt

  description: Historial de trabajo a equipo o técnico; no representa derivación. Una asignación activa 
    como máximo (endedAt ausente).
StatusChangeRequest:
  type: object
  properties:
    toStatus:
      type: string
      enum:
      - IN_PROGRESS
      - RESOLVED
      - REOPENED
      - CLOSED
      description: Solo transiciones operativas. Validación, derivación y designación de trabajo tienen 
        sus propias operaciones.
    reason:
      type: string
      description: Motivo exigible en reapertura/cierre, según reglas a acordar.
      maxLength: 2000
    resolutionNotes:
      type: string
      description: Obligatoria al pasar a RESOLVED; detalle de la actuación.
      maxLength: 5000
  required:
  - toStatus
  additionalProperties: false

StatusChangeDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    fromStatus:
      $ref: "./incidencias.yaml#/IncidentStatus"
    toStatus:
      $ref: "./incidencias.yaml#/IncidentStatus"
    reason:
      type: string
    resolutionNotes:
      type: string
    changedBy:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    changedAt:
      type: string
      format: date-time
  required:
  - id
  - incidentId
  - toStatus
  - changedAt
  description: fromStatus se omite en el registro inicial si no existía estado previo; changedBy se omite
    para eventos internos del sistema. El resto de los cambios debe respetar la trazabilidad y 
    autorización previstas.
CommentRequest:
  type: object
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 4000
    visibility:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
      description: INTERNAL solo para personal municipal.
  required:
  - body
  - visibility
  additionalProperties: false

CommentDTO:
  type: object
  properties:
    id:
      type: string
      format: uuid
    incidentId:
      type: string
      format: uuid
    body:
      type: string
    visibility:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
    author:
      $ref: "./usuarios.yaml#/UserSummaryDTO"
    createdAt:
      type: string
      format: date-time
  required:
  - id
  - incidentId
  - body
  - visibility
  - author
  - createdAt
DepartmentReferralRequest:
  type: object
  properties:
    departmentId:
      type: string
      format: uuid
    reason:
      type: string
      description: Justificación opcional de la derivación o transferencia. El evento queda auditado.
  required:
  - departmentId
  additionalProperties: false
  description: El OPERATOR deriva una incidencia validada al departamento, sin crear Assignment de 
    trabajo.
TeamWorkAssignmentRequest:
  type: object
  properties:
    teamId:
      type: string
      format: uuid
    reason:
      type: string
      maxLength: 1000
  required:
  - teamId
  additionalProperties: false
TechnicianWorkAssignmentRequest:
  type: object
  properties:
    technicianId:
      type: string
      format: uuid
    reason:
      type: string
      maxLength: 1000
  required:
  - technicianId
  additionalProperties: false
