ProblemDetail:
  type: object
  properties:
    type:
      type: string
      format: uri
      description: Identificador URI del tipo de problema.
      example: about:blank
    title:
      type: string
      description: Resumen legible del problema.
    status:
      type: integer
      description: Código HTTP asociado.
    code:
      type: string
      description: Código estable para tratamiento programático.
      example: INVALID_TRANSITION
    detail:
      type: string
      description: Explicación sin datos sensibles.
    instance:
      type: string
      description: Ruta de la petición que originó el error.
    requestId:
      type: string
      description: Identificador correlacionable con los registros del servidor.
    errors:
      type: array
      items:
        $ref: "./comunes.yaml#/FieldError"
      description: Errores de campos, cuando corresponda.
  required:
    - title
    - status
    - code
    - detail
  description: Formato de error uniforme inspirado en Problem Details (RFC 9457).

FieldError:
  type: object
  properties:
    field:
      type: string
      description: Nombre del campo.
    code:
      type: string
      description: Código de validación.
    message:
      type: string
      description: Motivo legible.
  required:
    - field
    - code
    - message

PageMetadata:
  type: object
  properties:
    page:
      type: integer
      minimum: 1
      example: 1
    pageSize:
      type: integer
      minimum: 1
      example: 20
    totalItems:
      type: integer
      description: Número total de resultados.
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
  required:
    - page
    - pageSize
    - totalItems
    - totalPages

CoordinatesDTO:
  type: object
  properties:
    latitude:
      type: number
      description: Latitud WGS84, grados.
      minimum: -90
      maximum: 90
      example: 36.7213
    longitude:
      type: number
      description: Longitud WGS84, grados.
      minimum: -180
      maximum: 180
      example: -4.4214
    accuracyMeters:
      type: number
      description: Precisión estimada de la posición en metros.
      minimum: 0
      example: 8
  required:
    - latitude
    - longitude
  description: Coordenadas geográficas; la precisión es opcional.
