KnowledgeDocumentDTO:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    version:
      type: string
    source:
      type: string
    uploadedAt:
      type: string
      format: date-time
    indexingStatus:
      type: string
      enum:
        - PENDING
        - INDEXED
        - FAILED
  required:
    - id
    - title
    - version
    - uploadedAt
    - indexingStatus

KnowledgeQueryRequest:
  type: object
  properties:
    question:
      type: string
      minLength: 5
      maxLength: 2000
    incidentId:
      type: string
      description: Permite contextualizar una consulta.
    maxCitations:
      type: integer
      minimum: 1
      maximum: 20
  required:
    - question
  additionalProperties: false

KnowledgeCitationDTO:
  type: object
  properties:
    documentId:
      type: string
    documentTitle:
      type: string
    documentVersion:
      type: string
    excerpt:
      type: string
      description: Fragmento recuperado.
    section:
      type: string
  required:
    - documentId
    - documentTitle
    - documentVersion
    - excerpt

KnowledgeAnswerDTO:
  type: object
  properties:
    answer:
      type: string
    citations:
      type: array
      items:
        $ref: "./conocimiento.yaml#/KnowledgeCitationDTO"
    confidence:
      type: number
      minimum: 0
      maximum: 1
    insufficientEvidence:
      type: boolean
      description: Verdadero si la documentación recuperada no basta para responder.
  required:
    - answer
    - citations
    - insufficientEvidence
