BadRequest:
  description: JSON mal formado, tipo de contenido incorrecto o solicitud no interpretable.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
Unauthorized:
  description: JWT ausente/inválido/caducado/revocado, cuenta inactiva o credenciales de login incorrectas; nunca se revela si existe un correo.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
Forbidden:
  description: Permisos insuficientes o recurso no accesible para este usuario.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
NotFound:
  description: Recurso inexistente o no visible para este usuario.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
Conflict:
  description: Regla de negocio, conflicto de estado, dato duplicado o concurrencia.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
ValidationError:
  description: JSON interpretable pero con datos que incumplen reglas de validación, como Bean Validation.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
TooManyRequests:
  description: Se ha superado el límite de solicitudes, determinado en esta primera etapa por la instancia del backend.
  headers:
    Retry-After:
      description: Segundos recomendados antes de reintentar, cuando se pueda calcular.
      schema:
        type: integer
        minimum: 0
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
InternalError:
  description: Error inesperado del servidor.
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
ServiceUnavailable:
  description: Servicio temporalmente no disponible (no se aplica a un enriquecimiento contextual opcional).
  content:
    application/problem+json:
      schema:
        $ref: "./schemas/comunes.yaml#/ProblemDetail"
