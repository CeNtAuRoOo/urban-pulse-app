/analytics/statistics:
  get:
    tags:
    - Analítica
    summary: Estadísticas territoriales
    description: Agregados por estado, categoría, distrito y tiempos de resolución.
    operationId: getAnalyticsStatistics
    x-roles:
    - OPERATOR
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/FromDate"
    - $ref: "../components/parameters.yaml#/ToDate"
    - name: districtId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Distrito opcional.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/analitica.yaml#/StatisticsDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/zones/{zoneId}/analysis:
  get:
    tags:
    - Analítica
    summary: Análisis de zona y periodo
    description: Agrega incidencias y observaciones contextuales del distrito/zona.
    operationId: getZonesZoneIdAnalysis
    x-roles:
    - OPERATOR
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/ZoneId"
    - $ref: "../components/parameters.yaml#/FromDate"
    - $ref: "../components/parameters.yaml#/ToDate"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/analitica.yaml#/ZoneAnalysisDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/analytics/hotspots:
  get:
    tags:
    - Analítica
    summary: Consultar concentraciones espaciales
    description: Consulta resultados de detección de zonas de concentración; las puntuaciones deben 
      interpretarse con cautela.
    operationId: getAnalyticsHotspots
    x-roles:
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/FromDate"
    - $ref: "../components/parameters.yaml#/ToDate"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/analitica.yaml#/HotspotDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/analytics/correlations:
  get:
    tags:
    - Analítica
    summary: Consultar correlaciones históricas
    description: Relaciona tendencias de incidencias con variables urbanas; no implica causalidad.
    operationId: getAnalyticsCorrelations
    x-roles:
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/FromDate"
    - $ref: "../components/parameters.yaml#/ToDate"
    - name: districtId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Distrito.
    - name: variable
      in: query
      required: false
      schema:
        type: string
      description: Variable urbana.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/analitica.yaml#/CorrelationDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
