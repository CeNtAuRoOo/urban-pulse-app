/map/incidents:
  get:
    tags:
    - Mapas
    summary: Obtener incidencias del mapa
    description: Recorta las incidencias al rectángulo geográfico WGS84. Los límites geográficos son 
      obligatorios para evitar consultas ilimitadas.
    operationId: getMapIncidents
    x-roles:
    - AUTHENTICATED
    parameters:
    - name: minLat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Límite sur.
    - name: minLon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Límite oeste.
    - name: maxLat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Límite norte.
    - name: maxLon
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Límite este.
    - name: status
      in: query
      required: false
      schema:
        $ref: "../components/schemas/incidencias.yaml#/IncidentStatus"
      description: Estado opcional.
    - name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Categoría opcional.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/mapas.yaml#/MapIncidentsDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
