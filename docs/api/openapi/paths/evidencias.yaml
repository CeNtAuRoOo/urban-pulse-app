/incidents/{incidentId}/attachments:
  post:
    tags:
      - Evidencias
    summary: Adjuntar fotografía
    description: >
      Almacena el binario en el bucket privado de Neon Object Storage
      y los metadatos en PostgreSQL. El formato se verifica mediante
      la firma binaria y la imagen se procesa antes de almacenarse.
      Se aplica una estrategia de compensación ante fallos parciales.
    operationId: postIncidentsIncidentIdAttachments
    x-roles:
      - CITIZEN
      - OPERATOR
      - TECHNICIAN
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      description: >
        Subida autenticada. Solo se admiten fotografías JPEG, PNG y WebP,
        según ADR-0004. El tamaño máximo está pendiente de acordar.
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
                description: >
                  Fotografía JPEG, PNG o WebP. El formato se comprueba
                  mediante su firma binaria.
              description:
                type: string
                description: Descripción opcional de la evidencia.
                maxLength: 300
            required:
              - file
            additionalProperties: false
    responses:
      "201":
        description: Evidencia creada correctamente.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
        headers:
          Location:
            description: Ruta al recurso creado.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  get:
    tags:
      - Evidencias
    summary: Listar fotografías
    description: >
      Lista los metadatos de las evidencias activas asociadas a una incidencia,
      sin revelar claves internas ni URLs públicas permanentes de almacenamiento.
    operationId: getIncidentsIncidentIdAttachments
    x-roles:
      - AUTHENTICATED
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Listado de evidencias obtenido correctamente.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/incidents/{incidentId}/attachments/{attachmentId}:
  get:
    tags:
      - Evidencias
    summary: Consultar metadatos de fotografía
    description: >
      Recupera los metadatos de una evidencia activa asociada a la incidencia
      indicada, previa autorización de acceso.
    operationId: getIncidentsIncidentIdAttachmentsAttachmentId
    x-roles:
      - AUTHENTICATED
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
      - $ref: "../components/parameters.yaml#/AttachmentId"
    responses:
      "200":
        description: Metadatos de la evidencia obtenidos correctamente.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  delete:
    tags:
      - Evidencias
    summary: Eliminar fotografía
    description: >
      Marca la evidencia como eliminada lógicamente. Los metadatos
      permanecen en PostgreSQL y el contenido binario no se elimina
      de Neon Object Storage.
    operationId: deleteIncidentsIncidentIdAttachmentsAttachmentId
    x-roles:
      - OPERATOR
      - TECHNICIAN
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
      - $ref: "../components/parameters.yaml#/AttachmentId"
    responses:
      "204":
        description: Evidencia eliminada correctamente.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/incidents/{incidentId}/attachments/{attachmentId}/content:
  get:
    tags:
      - Evidencias
    summary: Descargar fotografía privada
    description: >
      Recupera el contenido binario de una evidencia activa mediante
      el backend, previa autorización de acceso a la incidencia.
      El enlace no otorga acceso anónimo al objeto privado.
    operationId: getIncidentsIncidentIdAttachmentsAttachmentIdContent
    x-roles:
      - AUTHENTICATED
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
      - $ref: "../components/parameters.yaml#/AttachmentId"
    responses:
      "200":
        description: Binario de imagen autorizado.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"