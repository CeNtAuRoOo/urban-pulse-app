            schema:
              $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  delete:
    tags: [Evidencias]
    summary: Eliminar lógicamente fotografía
    description: >-
      Cuenta activa y correo verificado. Informante de la incidencia u OPERATOR/ADMIN global; una pertenencia TECHNICIAN/DEPARTMENT_COORDINATOR no concede acceso transversal. Se permite cualquier estado sin modificarlo. Incidencia ajena o inexistente devuelve 404 indistinguible; evidencia ajena, eliminada o pareja de IDs incorrecta también devuelve 404. Respuestas privadas con Cache-Control no-store.
      Establece deletedAt una sola vez, conserva fila y objeto privado S3 y libera una plaza. Repetir devuelve 404; no hay restauración HTTP. Registra auditoría interna atómica, sin ampliar el historial público de incidencias.
    operationId: deleteIncidentsIncidentIdAttachmentsAttachmentId
    x-implementation: implemented
    x-roles: [CITIZEN, OPERATOR, ADMIN]
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
      - $ref: "../components/parameters.yaml#/AttachmentId"
    responses:
      "204":
        description: Baja lógica confirmada, sin cuerpo.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
            description: Prohíbe almacenar respuestas privadas.
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

/incidents/{incidentId}/attachments/{attachmentId}/content:
  get:
    tags: [Evidencias]
    summary: Descargar fotografía privada
    description: >-
      Cuenta activa y correo verificado. Informante de la incidencia u OPERATOR/ADMIN global; una pertenencia TECHNICIAN/DEPARTMENT_COORDINATOR no concede acceso transversal. Se permite cualquier estado sin modificarlo. Incidencia ajena o inexistente devuelve 404 indistinguible; evidencia ajena, eliminada o pareja de IDs incorrecta también devuelve 404. Respuestas privadas con Cache-Control no-store.
      Entrega el binario saneado desde el backend, sin URLs S3 públicas ni claves de almacenamiento. Descarga acotada a 10 MiB en memoria.
    operationId: getIncidentsIncidentIdAttachmentsAttachmentIdContent
    x-implementation: implemented
    x-roles: [CITIZEN, OPERATOR, ADMIN]
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
      - $ref: "../components/parameters.yaml#/AttachmentId"
    responses:
      "200":
        description: Fotografía privada autorizada.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
            description: Prohíbe almacenar respuestas privadas.
          Content-Disposition:
            description: attachment con nombre saneado y codificación UTF-8 segura.
            schema:
              type: string
          Content-Length:
            description: Longitud real de la imagen saneada.
            schema:
              type: integer
              format: int64
              minimum: 1
              maximum: 10485760
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
