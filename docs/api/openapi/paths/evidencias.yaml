/incidents/{incidentId}/attachments:
  post:
    tags: [Evidencias]
    summary: Adjuntar fotografía
    description: >-
      Cuenta activa y correo verificado. Informante de la incidencia u OPERATOR/ADMIN global; una pertenencia TECHNICIAN/DEPARTMENT_COORDINATOR no concede acceso transversal. Se permite cualquier estado sin modificarlo. Incidencia ajena o inexistente devuelve 404 indistinguible; evidencia ajena, eliminada o pareja de IDs incorrecta también devuelve 404. Respuestas privadas con Cache-Control no-store.
      Máximo cinco evidencias activas en total por incidencia, resistente a concurrencia; la sexta devuelve 409 ATTACHMENT_LIMIT_REACHED. Firma y decodificación determinan el formato, no la extensión ni el MIME declarado. Recodifica sin EXIF/GPS antes de S3; compensa el objeto si falla la confirmación SQL.
    operationId: postIncidentsIncidentIdAttachments
    x-implementation: implemented
    x-roles: [CITIZEN, OPERATOR, ADMIN]
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: JPEG (.jpg/.jpeg) o PNG; máximo 10 MiB (10485760 bytes). No acepta otros formatos.
              description:
                type: string
                maxLength: 300
                description: Texto opcional, máximo 300 puntos Unicode. Si se omite, el DTO devuelve null.
    responses:
      "201":
        description: Evidencia confirmada; sizeBytes corresponde al contenido saneado.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
            description: Prohíbe almacenar respuestas privadas.
          Location:
            description: Ruta relativa del recurso creado.
            schema:
              type: string
              example: /api/v1/incidents/019a6fb0-1234-7000-8000-000000000001/attachments/019a6fb0-1234-7000-8000-000000000002
        content:
          application/json:
            schema:
              $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "413":
        description: ATTACHMENT_TOO_LARGE; entrada o salida mayor de 10485760 bytes, o petición multipart mayor de 11534336 bytes. Se aplica incluso antes del controlador.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "422":
        description: INVALID_ATTACHMENT_FORMAT o INVALID_ATTACHMENT_DESCRIPTION; solo JPEG/PNG íntegros de hasta 16 millones de píxeles y 8192 por lado; descripción de hasta 300 puntos Unicode.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"

  get:
    tags: [Evidencias]
    summary: Listar fotografías de una incidencia
    description: >-
      Cuenta activa y correo verificado. Informante de la incidencia u OPERATOR/ADMIN global; una pertenencia TECHNICIAN/DEPARTMENT_COORDINATOR no concede acceso transversal. Se permite cualquier estado sin modificarlo. Incidencia ajena o inexistente devuelve 404 indistinguible; evidencia ajena, eliminada o pareja de IDs incorrecta también devuelve 404. Respuestas privadas con Cache-Control no-store.
      Colección sin paginación de hasta cinco activas, orden createdAt DESC e id DESC; no existe listado global.
    operationId: getIncidentsIncidentIdAttachments
    x-implementation: implemented
    x-roles: [CITIZEN, OPERATOR, ADMIN]
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Metadatos activos de la incidencia autorizada.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
            description: Prohíbe almacenar respuestas privadas.
        content:
          application/json:
            schema:
              type: array
              maxItems: 5
              items:
                $ref: "../components/schemas/evidencias.yaml#/AttachmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

