      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/incidents/{incidentId}/asset-association:
  put:
    tags:
    - Contexto urbano
    summary: 'Diseño futuro: Confirmar activo urbano'
    description: Crea o reemplaza una única asociación del activo afectado, con trazabilidad.
    operationId: putIncidentsIncidentIdAssetAssociation
    x-implementation: future
    x-roles:
    - OPERATOR
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/contexto-urbano.yaml#/UrbanAssetAssociationRequest"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/contexto-urbano.yaml#/UrbanAssetAssociationDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/urban-assets:
  get:
    tags:
    - Contexto urbano
    summary: Buscar activos urbanos
    description: >-
      Consulta de solo lectura del catálogo unificado PostGIS cartografia.contexto_urbano.
      type filtra por source_table. La búsqueda por proximidad requiere latitude,
      longitude y radiusMeters conjuntamente; las coordenadas de entrada son WGS84
      y se transforman a EPSG:25830 para aplicar ST_DWithin y ordenar por distancia.
      La respuesta devuelve geom como WKT en SRID 25830. No asocia activos a incidencias.
    operationId: getUrbanAssets
    x-implementation: implemented
    x-roles:
    - AUTHENTICATED
    parameters:
    - name: type
      in: query
      required: false
      schema:
        type: string
      description: Coincidencia exacta con source_table; se recortan espacios exteriores.
    - name: latitude
      in: query
      required: false
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Latitud WGS84; debe enviarse junto con longitude y radiusMeters.
    - name: longitude
      in: query
      required: false
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Longitud WGS84; debe enviarse junto con latitude y radiusMeters.
    - name: radiusMeters
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 5000
      description: Radio en metros, entre 1 y 5000; debe enviarse junto con latitude y longitude.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/contexto-urbano.yaml#/UrbanAssetRecordDTO"
      "400":
        description: Parámetros de proximidad incompletos o fuera de rango.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

