/external-observations:
  get:
    tags:
    - Contexto urbano
    summary: 'Diseño futuro: Consultar observaciones normalizadas'
    description: Acceso interno a observaciones históricas; filtrado por fuente, métrica y fechas.
    operationId: getExternalObservations
    x-implementation: future
    x-roles:
    - OPERATOR
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/FromDate"
    - $ref: "../components/parameters.yaml#/ToDate"
    - name: sourceId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador del proveedor.
    - name: metric
      in: query
      required: false
      schema:
        type: string
      description: Variable registrada.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/contexto-urbano.yaml#/ExternalObservationDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
