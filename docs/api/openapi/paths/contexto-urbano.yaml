/incidents/{incidentId}/urban-context:
  get:
    tags:
    - Contexto urbano
    summary: 'Diseño futuro: Consultar contexto asociado'
    description: Observaciones cercanas con procedencia y caducidad; puede devolver PARTIAL/UNAVAILABLE 
      sin ocultar la incidencia.
    operationId: getIncidentsIncidentIdUrbanContext
    x-implementation: future
    x-roles:
    - OPERATOR
    - TECHNICIAN
    - ADMIN
    parameters:
    - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/contexto-urbano.yaml#/UrbanContextDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

