/incidents/assigned-to-me:
  get:
    tags:
      - Tramitación
    summary: Mi cola de trabajo
    description: Trabajos asignados al técnico o a un Team donde sea miembro activo del departamento 
      responsable. El servicio comprueba pertenencia y visibilidad.
    operationId: getIncidentsAssignedToMe
    x-roles:
      - TECHNICIAN
    parameters:
      - $ref: "../components/parameters.yaml#/Page"
      - $ref: "../components/parameters.yaml#/PageSize"
      - name: status
        in: query
        required: false
        schema:
          $ref: "../components/schemas/incidencias.yaml#/IncidentStatus"
        description: Estado del trabajo.
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
