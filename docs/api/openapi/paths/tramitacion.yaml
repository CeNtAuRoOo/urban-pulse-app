/incidents/{incidentId}/reviews:
  post:
    tags:
      - Tramitación
    summary: Validar, rechazar o pedir información
    description: Solo un operador puede registrar decisiones. VALIDATE pasa a VALIDATED y REJECT a 
      REJECTED; REQUEST_INFORMATION conserva REPORTED y registra motivo (propuesta).
    operationId: postIncidentsIncidentIdReviews
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tramitacion.yaml#/ReviewRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tramitacion.yaml#/ReviewDTO"
        headers:
          Location:
            description: Ruta al nuevo recurso, cuando esté disponible.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  get:
    tags:
      - Tramitación
    summary: Consultar revisiones
    description: Historial de decisiones y motivos para trazabilidad.
    operationId: getIncidentsIncidentIdReviews
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/tramitacion.yaml#/ReviewDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

