/incidents/assigned-to-me:
  get:
    tags:
      - Tramitación
    summary: Mi cola de trabajo
    description: Incidencias asignadas al técnico autenticado, sin revelar tareas de otros técnicos.
    operationId: getIncidentsAssignedToMe
    x-roles:
      - TECHNICIAN
    parameters:
      - $ref: "../components/parameters.yaml#/Page"
      - $ref: "../components/parameters.yaml#/PageSize"
      - name: status
        in: query
        required: false
        schema:
          $ref: "../components/schemas/incidencias.yaml#/IncidentStatus"
        description: Estado del trabajo.
    responses:
      "200":
        description: Operación correcta.
