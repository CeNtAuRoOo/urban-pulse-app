/incidents/{incidentId}/assignments:
  post:
    tags:
      - Tramitación
    summary: Asignar o reasignar trabajo a equipo o técnico
    description: Solo un coordinador del departamento responsable crea/reasigna trabajo. La incidencia ha
      de estar derivada previamente; pasa a WORK_ASSIGNED cuando procede. Exactamente un Team o 
      Technician y una asignación activa por incidencia.
    operationId: postIncidentsIncidentIdAssignments
    x-roles:
      - DEPARTMENT_COORDINATOR
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tramitacion.yaml#/AssignmentRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tramitacion.yaml#/AssignmentDTO"
        headers:
          Location:
            description: Ruta al nuevo recurso, cuando esté disponible.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  get:
    tags:
      - Tramitación
    summary: Consultar asignaciones
    description: Historial temporal de asignaciones concretas de trabajos, incluidas las terminadas; 
      acceso restringido por departamento, asignación y permisos.
    operationId: getIncidentsIncidentIdAssignments
    x-roles:
      - OPERATOR
      - DEPARTMENT_COORDINATOR
      - TECHNICIAN
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/tramitacion.yaml#/AssignmentDTO"
