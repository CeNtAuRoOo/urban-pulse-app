/incidents/{incidentId}/department:
  put:
    tags:
      - Tramitación
    summary: Derivar o transferir incidencia a departamento
    description: Operador municipal global. Guarda Incident.assignedDepartment y audita origen/destino. 
      Una incidencia VALIDATED puede quedar sin departamento hasta realizar esta operación. Transferir 
      trabajo activo requiere finalizar la asignación anterior.
    operationId: putIncidentsIncidentIdDepartment
    x-roles:
      - OPERATOR
    parameters:
      - $ref: ../components/parameters.yaml#/IncidentId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tramitacion.yaml#/DepartmentReferralRequest
    responses:
      '200':
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/incidencias.yaml#/IncidentDTO
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/ValidationError
      '500':
        $ref: ../components/responses.yaml#/InternalError
/incidents/{incidentId}/assignments/{assignmentId}/acceptance:
  post:
    tags:
      - Tramitación
    summary: Aceptar trabajo asignado
    description: Solo el técnico destinatario o un miembro válido del equipo asignado. Registra 
      acceptedBy/acceptedAt sin pasar automáticamente a IN_PROGRESS.
    operationId: postIncidentsIncidentIdAssignmentsAssignmentIdAcceptance
    x-roles:
      - TECHNICIAN
    parameters:
      - $ref: ../components/parameters.yaml#/IncidentId
      - $ref: ../components/parameters.yaml#/AssignmentId
    responses:
      '200':
        description: Operación correcta.
        content:
