/incidents/{incidentId}/assignments:
  post:
    tags:
      - Tramitación
    summary: Asignar o reasignar
    description:
      Crea asignación temporal a departamento y opcionalmente técnico/equipo. La primera asignación
      requiere VALIDATED y transiciona a ASSIGNED.
    operationId: postIncidentsIncidentIdAssignments
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/tramitacion.yaml#/AssignmentRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/tramitacion.yaml#/AssignmentDTO"
        headers:
          Location:
            description: Ruta al nuevo recurso, cuando esté disponible.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  get:
    tags:
      - Tramitación
    summary: Consultar asignaciones
    description: Historial de asignaciones, incluidas las ya finalizadas.
    operationId: getIncidentsIncidentIdAssignments
    x-roles:
      - OPERATOR
      - TECHNICIAN
      - ADMIN
