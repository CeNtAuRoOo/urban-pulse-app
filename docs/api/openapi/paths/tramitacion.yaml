/incidents/{incidentId}/reviews:
  post:
    tags:
      - Tramitación
    summary: Registrar revisión
    description: OPERATOR/ADMIN global activo y verificado, nunca el informante, incluso ADMIN. REPORTED permite VALIDATE
      con categoría activa explícita, REJECT o REQUEST_INFORMATION con motivo obligatorio. AWAITING_INFORMATION solo
      permite REJECT. VALIDATE prohíbe reason; las otras variantes prohíben categoryId, incluso null. Categoría, estado,
      revisión, StatusChange y auditoría son atómicos. Sin rectificación posterior. Cuerpo JSON estricto máximo 64 KiB;
      versión esperada obligatoria bajo bloqueo usuario → incidencia.
    operationId: postReviewCreate
    x-implementation: implemented
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: ../components/parameters.yaml#/IncidentId
    responses:
      "201":
        description: Recurso confirmado.
        headers:
          Cache-Control: &a1
            $ref: ../components/headers.yaml#/PrivateCache
          Location:
            description: Ruta relativa al GET individual implementado del recurso creado.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/tramitacion.yaml#/ReviewDTO
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "413":
        $ref: ../components/responses.yaml#/PayloadTooLarge
      "422":
        $ref: ../components/responses.yaml#/ValidationError
      "500":
        $ref: ../components/responses.yaml#/InternalError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailable
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tramitacion.yaml#/ReviewRequest
  get:
    tags:
      - Tramitación
    summary: Consultar revisiones
    description: Solo OPERATOR/ADMIN global; incluye actor y datos internos. La prohibición de autorrevisión afecta a crear
      decisiones, no a consultar el historial. Cuenta activa y verificada, con permisos reales revalidados. Consulta
      disponible en cualquier estado de la incidencia. Se limita al padre autorizado; 404 indistinguible si la
      incidencia no es visible o la pareja de IDs no corresponde. Orden fecha DESC, UUID DESC, page desde 1 y pageSize
      de 20 por defecto (máximo 100); rechaza parámetros desconocidos.
    operationId: getIncidentReviews
    x-implementation: implemented
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: ../components/parameters.yaml#/IncidentId
      - $ref: ../components/parameters.yaml#/Page
      - $ref: ../components/parameters.yaml#/PageSize
    responses:
      "200":
        description: Consulta autorizada.
        headers:
          Cache-Control: *a1
        content:
          application/json:
            schema:
              $ref: ../components/schemas/tramitacion.yaml#/ReviewPageDTO
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "500":
        $ref: ../components/responses.yaml#/InternalError
      "503":
        $ref: ../components/responses.yaml#/ServiceUnavailable
