/categories:
  get:
    x-implementation: implemented
    tags:
      - Catálogos
    summary: Listar categorías
    description: Incluye categorías activas e inactivas, ordenadas por nombre ascendente según collation PostgreSQL y UUID como desempate. Requiere correo verificado.
    operationId: getCategories
    x-roles:
      - AUTHENTICATED
    x-email-verified: true
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  post:
    x-implementation: implemented
    tags:
      - Catálogos
    summary: Crear categoría
    description: Alta con rol global ADMIN y correo verificado. Active omitido o null equivale a true. Nombre único sin distinguir mayúsculas, también para categorías inactivas.
    operationId: postCategories
    x-roles:
      - ADMIN
    x-email-verified: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/CategoryWriteRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
        headers:
          Location:
            description: URI absoluta de la categoría creada. Siempre presente en la respuesta 201.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        description: Nombre duplicado (CATEGORY_DUPLICATE), también si está inactiva o hay escrituras concurrentes.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/categories/{categoryId}:
  get:
    x-implementation: implemented
    tags:
      - Catálogos
    summary: Consultar categoría
    description: Consulta por UUID, incluida si está inactiva. Requiere correo verificado.
    operationId: getCategoriesCategoryId
    x-roles:
      - AUTHENTICATED
    x-email-verified: true
    parameters:
      - $ref: "../components/parameters.yaml#/CategoryId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        description: Categoría inexistente (CATEGORY_NOT_FOUND).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  patch:
    x-implementation: implemented
    tags:
      - Catálogos
    summary: Actualizar categoría
    description: PATCH con rol global ADMIN y correo verificado; omitir conserva, null devuelve 400 INVALID_JSON, objeto vacío devuelve 422 VALIDATION_ERROR. Descripción vacía limpia el contenido; active false desactiva y true reactiva, preservando referencias históricas.
    operationId: patchCategoriesCategoryId
    x-roles:
      - ADMIN
    x-email-verified: true
    parameters:
      - $ref: "../components/parameters.yaml#/CategoryId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/CategoryPatchRequest"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        description: Categoría inexistente (CATEGORY_NOT_FOUND).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "409":
        description: Nombre duplicado (CATEGORY_DUPLICATE), también si está inactiva o hay escrituras concurrentes.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

