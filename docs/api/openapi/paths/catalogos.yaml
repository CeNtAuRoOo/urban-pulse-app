/categories:
  get:
    tags:
      - Catálogos
    summary: Listar categories
    description: Catálogo disponible para los clientes autenticados.
    operationId: getCategories
    x-roles:
      - AUTHENTICATED
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  post:
    tags:
      - Catálogos
    summary: Crear categoría
    description: Alta administrativa del catálogo.
    operationId: postCategories
    x-roles:
      - ADMIN
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/CategoryWriteRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
        headers:
          Location:
            description: Ruta al nuevo recurso, cuando esté disponible.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/categories/{categoryId}:
  get:
    tags:
      - Catálogos
    summary: Consultar categoría
    description: Detalle del elemento de catálogo.
    operationId: getCategoriesCategoryId
    x-roles:
      - AUTHENTICATED
    parameters:
      - $ref: "../components/parameters.yaml#/CategoryId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  patch:
    tags:
      - Catálogos
    summary: Actualizar categoría
    description: Actualización administrativa, sin borrar referencias históricas.
    operationId: patchCategoriesCategoryId
    x-roles:
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/CategoryId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/CategoryPatchRequest"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/CategoryDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/departments:
  get:
    tags:
      - Catálogos
    summary: Listar departamentos
    description: Incluye activos e inactivos, ordenados por nombre ascendente según collation PostgreSQL. Requiere correo verificado.
    operationId: getDepartments
    x-roles:
      - AUTHENTICATED
    x-email-verified: true
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/catalogos.yaml#/DepartmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  post:
    tags:
      - Catálogos
    summary: Crear departamento
    description: Alta con rol global ADMIN y correo verificado. Nombre y código únicos sin distinguir mayúsculas.
    operationId: postDepartments
    x-roles:
      - ADMIN
    x-email-verified: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/DepartmentWriteRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/DepartmentDTO"
        headers:
          Location:
            description: URI absoluta del departamento creado. Siempre presente en la respuesta 201.
            schema:
              type: string
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/departments/{departmentId}:
  get:
    tags:
      - Catálogos
    summary: Consultar departamento
    description: Consulta por UUID, incluido si está inactivo. Requiere correo verificado.
    operationId: getDepartmentsDepartmentId
    x-roles:
      - AUTHENTICATED
    x-email-verified: true
    parameters:
      - $ref: "../components/parameters.yaml#/DepartmentId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/DepartmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  patch:
    tags:
      - Catálogos
    summary: Actualizar departamento
    description: PATCH con rol global ADMIN y correo verificado; omitir conserva, null devuelve 400. Desactivar preserva referencias históricas.
    operationId: patchDepartmentsDepartmentId
    x-roles:
      - ADMIN
    x-email-verified: true
    parameters:
      - $ref: "../components/parameters.yaml#/DepartmentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/catalogos.yaml#/DepartmentPatchRequest"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/catalogos.yaml#/DepartmentDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
