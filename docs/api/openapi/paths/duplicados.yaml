/incidents/{incidentId}/duplicate-candidates:
  get:
    tags:
      - Duplicados
    summary: 'Obtener candidatos a incidencia duplicada'
    description: |
      Requiere OPERATOR o ADMIN global vigente, cuenta activa y EMAIL_VERIFIED.
      Consulta todos los candidatos no vinculados a ±72 horas inclusivas y hasta 250 m
      Haversine. Devuelve como máximo las veinte mejores puntuaciones, con
      desempate por UUID ascendente sin signo. Categoría opcional; sin semántica textual.
      Preselección conservadora por latitud, filtros y ranking en SQL antes del corte.
      Timeout SQL de 5 s; 503 DUPLICATE_QUERY_TIMEOUT sin sugerencias parciales.
      No persiste ni confirma sugerencias. Cache-Control no-store.
    operationId: getIncidentsIncidentIdDuplicateCandidates
    x-implementation: implemented
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    responses:
      "200":
        description: Operación correcta.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/duplicados.yaml#/DuplicateSuggestionDTO"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "503":
        description: PostgreSQL no disponible o timeout; sin respuesta parcial.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

/incidents/{incidentId}/duplicate-links:
  post:
    tags:
      - Duplicados
    summary: 'Confirmar relación de duplicidad'
    description: |
      Confirmación manual por OPERATOR/ADMIN global vigente, cuenta activa y EMAIL_VERIFIED.
      Relación simétrica y única, sin autoenlaces. Conserva reportes, evidencias e historiales;
      vínculo y auditoría son atómicos. No prohíbe ciclos arbitrarios ni permite desvincular.
      Responde 201 con Cache-Control no-store, sin Location al no existir GET del vínculo.
    operationId: postIncidentsIncidentIdDuplicateLinks
    x-implementation: implemented
    x-roles:
      - OPERATOR
      - ADMIN
    parameters:
      - $ref: "../components/parameters.yaml#/IncidentId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/duplicados.yaml#/DuplicateLinkRequest"
    responses:
      "201":
        description: Recurso creado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/duplicados.yaml#/DuplicateLinkDTO"
        headers:
          Cache-Control:
            schema: {type: string, enum: [no-store]}
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/ValidationError"
      "503":
        description: PostgreSQL no disponible o timeout; sin respuesta parcial.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/comunes.yaml#/ProblemDetail"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
