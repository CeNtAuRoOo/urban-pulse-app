storage.s3.endpoint=http://127.0.0.1:9
storage.s3.region=eu-central-1
storage.s3.bucket=unused-test-bucket

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.sql.init.mode=never

security.jwt.issuer=urbanpulse-tests
security.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
security.jwt.allowed-origins=http://localhost:7777
security.jwt.ttl-seconds=7200

security.rate-limit.register-ip.capacity=5
security.rate-limit.register-ip.refill-seconds=300

security.rate-limit.login-ip.capacity=20
security.rate-limit.login-ip.refill-seconds=1200
security.rate-limit.login-email.capacity=5
security.rate-limit.login-email.refill-seconds=300

security.rate-limit.max-keys=10000

security.rate-limit.confirm-ip.capacity=30
security.rate-limit.confirm-ip.refill-seconds=3600
security.rate-limit.confirm-user.capacity=5
security.rate-limit.confirm-user.refill-seconds=3600

security.rate-limit.resend-cooldown.capacity=1
security.rate-limit.resend-cooldown.refill-seconds=60
security.rate-limit.resend-ip.capacity=20
security.rate-limit.resend-ip.refill-seconds=3600
security.rate-limit.resend-user.capacity=5
security.rate-limit.resend-user.refill-seconds=86400

spring.mail.host=127.0.0.1
spring.mail.port=9
spring.mail.username=
spring.mail.password=

spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
spring.mail.properties[mail.smtp.starttls.required]=false

app.mail.from=no-reply@urbanpulse.test

security.email-verification.secret=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
security.email-verification.cleanup-cron=-
security.email-verification.cleanup-batch-size=100
security.email-verification.cleanup-max-batches=10
