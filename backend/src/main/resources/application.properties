# Aplicación
spring.application.name=urban-pulse
server.port=8888

# PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Object Storage (Neon)
storage.s3.endpoint=${AWS_ENDPOINT_URL_S3}
storage.s3.region=eu-central-1
storage.s3.bucket=incident-evidence

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.error=OFF

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Evitar inicializaciones SQL paralelas a Flyway
spring.sql.init.mode=never

