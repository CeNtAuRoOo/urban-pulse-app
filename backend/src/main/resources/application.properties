# Aplicación
spring.application.name=urban-pulse
server.port=8888

# PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Object Storage (Neon)
storage.s3.endpoint=${AWS_ENDPOINT_URL_S3}
storage.s3.region=eu-central-1
storage.s3.bucket=incident-evidence

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.error=OFF

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Evitar inicializaciones SQL paralelas a Flyway
spring.sql.init.mode=never

# JWT: Base64 de al menos 32 bytes aleatorios; sin valor secreto predeterminado.
security.jwt.issuer=${JWT_ISSUER}
security.jwt.secret=${JWT_SECRET}
security.jwt.allowed-origins=${CORS_ALLOWED_ORIGINS}
security.jwt.ttl-seconds=7200

# Token buckets: capacidad y segundos para reponer la capacidad completa.
security.rate-limit.register-ip.capacity=5
security.rate-limit.register-ip.refill-seconds=300

security.rate-limit.login-ip.capacity=20
security.rate-limit.login-ip.refill-seconds=1200
security.rate-limit.login-email.capacity=5
security.rate-limit.login-email.refill-seconds=300

security.rate-limit.max-keys=10000

# Solo IP de conexión: no aceptar Forwarded/X-Forwarded-For del cliente.
server.forward-headers-strategy=none
