# Configuración común del backend; los valores propios del entorno se inyectan con ${...}.
# Las credenciales AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY las lee directamente el SDK de AWS.

# Aplicación: nombre y puerto comunes al servicio y a los contenedores
spring.application.name=urban-pulse
server.port=8888

# PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Object Storage (Neon): recursos específicos de cada entorno
storage.s3.endpoint=${AWS_ENDPOINT_URL_S3}
storage.s3.region=${AWS_REGION}
storage.s3.bucket=${STORAGE_BUCKET}

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.error=OFF

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=false

# Evitar inicializaciones SQL paralelas a Flyway
spring.sql.init.mode=never

# JWT: emisor y secreto del entorno; vigencia común de dos horas
security.jwt.issuer=${JWT_ISSUER}
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=7200

# CORS: orígenes del frontend autorizados en cada entorno
security.jwt.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Token buckets de autenticación
security.rate-limit.register-ip.capacity=5
security.rate-limit.register-ip.refill-seconds=300

security.rate-limit.login-ip.capacity=20
security.rate-limit.login-ip.refill-seconds=1200
security.rate-limit.login-email.capacity=5
security.rate-limit.login-email.refill-seconds=300

security.rate-limit.max-keys=10000

# Token buckets de verificación de email
security.rate-limit.confirm-ip.capacity=30
security.rate-limit.confirm-ip.refill-seconds=3600
security.rate-limit.confirm-user.capacity=5
security.rate-limit.confirm-user.refill-seconds=3600

security.rate-limit.resend-cooldown.capacity=1
security.rate-limit.resend-cooldown.refill-seconds=60
security.rate-limit.resend-ip.capacity=20
security.rate-limit.resend-ip.refill-seconds=3600
security.rate-limit.resend-user.capacity=5
security.rate-limit.resend-user.refill-seconds=86400

# Solo IP de conexión: no aceptar Forwarded/X-Forwarded-For del cliente.
server.forward-headers-strategy=none

# Mail: transporte y remitente específicos de cada entorno
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS}

app.mail.from=${MAIL_FROM}

# Mail: tiempos de espera comunes, en milisegundos
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Verificación de email: clave del entorno y política común de limpieza
security.email-verification.secret=${EMAIL_VERIFICATION_SECRET}
security.email-verification.cleanup-cron=0 0 * * * *
security.email-verification.cleanup-batch-size=100
security.email-verification.cleanup-max-batches=10

# Invitaciones: clave independiente y siete días exactos de vigencia
security.staff-invitation.secret=${STAFF_INVITATION_SECRET}
security.staff-invitation.ttl-days=7

# Token buckets de invitaciones
security.rate-limit.invitation-user.capacity=10
security.rate-limit.invitation-user.refill-seconds=900
security.rate-limit.invitation-ip.capacity=30
security.rate-limit.invitation-ip.refill-seconds=900
